server {
    listen 80;
    server_name guideon.om www.guideon.om;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name guideon.om www.guideon.om;
    ssl_certificate     /etc/letsencrypt/live/guideon.om/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guideon.om/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 60M;

    # Self-hosted Supabase API (browser loads images via /storage/v1; server-side
    # supabase-js also comes back through here when SUPABASE_URL=https://guideon.om)
    location ~ ^/(rest|storage|auth|realtime|functions)/v1/ {
        # 172.17.0.1 = Docker host bridge gateway (Kong maps 0.0.0.0:8000)
        proxy_pass http://172.17.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 60M;
    }

    # Self-hosted deploy webhook (systemd service on the host, port 9000).
    # GitHub POSTs a signed push notification here; the service verifies the
    # HMAC and runs deploy.sh locally. 172.17.0.1 = Docker host bridge gateway.
    location = /deploy-hook {
        proxy_pass http://172.17.0.1:9000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 1200s;
    }

    # Node app (pages + /api)
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}

# ── wafa.guideon.om → Al-Wafa accounting app (alwafa:4000) ──
server {
    listen 80;
    server_name wafa.guideon.om;
    client_max_body_size 25m;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / {
        proxy_pass http://alwafa:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
