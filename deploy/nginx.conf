server {
    listen 80;
    server_name guideon.om www.guideon.om;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://guideon.om$request_uri; }
}
# www → apex. www used to serve the full site, so Google indexed two copies of
# every page and split their ranking ("duplicate, Google chose a different
# canonical" in Search Console). One host, one copy.
server {
    listen 443 ssl;
    http2 on;
    server_name www.guideon.om;
    ssl_certificate     /etc/letsencrypt/live/guideon.om/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guideon.om/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://guideon.om$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name guideon.om;
    ssl_certificate     /etc/letsencrypt/live/guideon.om/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guideon.om/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 60M;

    # Public storage objects, cached hard. Every upload is written under a fresh
    # UUID (storageService.js), so a public object never changes under its key.
    # Supabase answers `Cache-Control: no-cache`, which made every visitor
    # re-download all the photos and the hero video on every single page view —
    # about 5.8 MB per visit on the home page alone.
    # This block must come BEFORE the general API one: nginx takes the first
    # matching regex, and the REST/auth endpoints must stay uncached.
    location ~ ^/storage/v1/object/public/ {
        proxy_pass http://172.17.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Self-hosted Supabase API (browser loads images via /storage/v1; server-side
    # supabase-js also comes back through here when SUPABASE_URL=https://guideon.om)
    location ~ ^/(rest|storage|auth|realtime|functions)/v1/ {
        # 172.17.0.1 = Docker host bridge gateway (Kong maps 0.0.0.0:8000)
        proxy_pass http://172.17.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 60M;
    }

    # Self-hosted deploy webhook (systemd service on the host, port 9000).
    # GitHub POSTs a signed push notification here; the service verifies the
    # HMAC and runs deploy.sh locally. 172.17.0.1 = Docker host bridge gateway.
    location = /deploy-hook {
        proxy_pass http://172.17.0.1:9000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 1200s;
    }

    # Node app (pages + /api)
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}

# ── rushd.guideon.om → تحويل دائم إلى rushd.om (النطاق الرسمي) ──
# نُبقي الشهادة ومسار ACME: طلب HTTPS يحتاج شهادة صالحة **قبل** أن يصل
# التحويل أصلاً — فبلا تجديدها ينقطع التحويل نفسه بعد 90 يوماً.
server {
    listen 80;
    server_name rushd.guideon.om;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://rushd.om$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name rushd.guideon.om;
    ssl_certificate     /etc/letsencrypt/live/rushd.guideon.om/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rushd.guideon.om/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # 301 دائم مع حفظ المسار — روابط الفواتير المُرسلة سابقاً تصل لوجهتها.
    location / { return 301 https://rushd.om$request_uri; }
}

# ── rushd.om — النطاق الرسمي لمنصة رشد ──
# www يُحوَّل للجذر، والجذر يُخدَم عبر HTTPS من rushd-app.
server {
    listen 80;
    server_name rushd.om www.rushd.om;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://rushd.om$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name www.rushd.om;
    ssl_certificate     /etc/letsencrypt/live/rushd.om/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rushd.om/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://rushd.om$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name rushd.om;
    ssl_certificate     /etc/letsencrypt/live/rushd.om/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rushd.om/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 25m;

    # ضغط الملفات النصّية — يقلّص حزمة الجافاسكربت ~1.18MB إلى ~300KB فيسرّع الفتح.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml font/woff2 text/plain application/manifest+json;

    # الأصول ذات البصمة (Vite) — تخزين مؤقّت طويل، فلا يُعاد تحميلها كل فتحة.
    location /assets/ {
        proxy_pass http://rushd-app:4000;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://rushd-app:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
