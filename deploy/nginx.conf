# Reverse proxy for Guideon — TLS termination + proxy to the Node app.
# Replace guideon.om with your domain. Certificates issued by certbot.

server {
    listen 80;
    server_name guideon.om www.guideon.om;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # Redirect everything else to HTTPS
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name guideon.om www.guideon.om;

    ssl_certificate     /etc/letsencrypt/live/guideon.om/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guideon.om/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 60M;   # allow image/video uploads

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;   # SSE / websockets
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;            # long-lived SSE (notifications)
        proxy_buffering off;                # stream SSE immediately
    }
}
