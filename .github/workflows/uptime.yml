name: Uptime check

# Pings the live site every ~10 minutes. If it's down (after retries), the job
# FAILS — GitHub then emails the repo owner automatically. Runs on GitHub's
# servers (off the VPS), so it still alerts even if the whole server is down.
# Public repo → Actions minutes are free.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}   # allow manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check guideon.om is up
        run: |
          URL="https://guideon.om/"
          ok=0
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "$URL" || echo 000)
            echo "attempt $i → HTTP $code"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "::error::guideon.om is DOWN (last HTTP $code)"
            exit 1
          fi
          echo "guideon.om is up ✅"
