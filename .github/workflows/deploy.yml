name: Deploy

# Auto-deploy to the Oman Data Park VPS on every push to main.
# Runs the test suite first; only deploys if it passes.
on:
  push:
    branches: [ main ]

# Never run two deploys at once (a second push waits for the first to finish).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Syntax check
        run: node --check src/app.js
      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder_key

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            set -e
            cd /opt/guideon
            # Conclude any leftover unfinished merge from a previous manual deploy.
            git commit --no-edit 2>/dev/null || true
            # deploy.sh pulls latest main, rebuilds the Docker Compose stack.
            bash /opt/deploy.sh
            # git pull creates new inodes; nginx needs a remount to see them.
            docker restart guideon-nginx
