<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f7b6c">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<title>Company Profile — Guideon</title>
<link id="bs-ltr" rel="stylesheet" href="/css/bootstrap.min.css" media="not all">
<link id="bs-rtl" rel="stylesheet" href="/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="/css/style.css?v=40">
<style>
  .co-hero { background:linear-gradient(140deg,#0f1c3e 0%,#1a2c5b 45%,#0f7b6c 100%); color:#fff; padding:48px 0 28px; }
  .co-avatar { width:108px; height:108px; border-radius:18px; border:4px solid rgba(255,255,255,.35); background:rgba(255,255,255,.15); display:flex; align-items:center; justify-content:center; font-size:2.4rem; font-weight:800; color:#fff; overflow:hidden; }
  .co-avatar img { width:100%; height:100%; object-fit:cover; border-radius:14px; }
  .info-card { background:#fff; border-radius:16px; padding:24px; box-shadow:0 2px 12px rgba(0,0,0,.07); margin-bottom:20px; border:1px solid #eef0f4; }
  .info-card h5 { font-weight:800; font-size:1.05rem; color:#1a1a2e; margin-bottom:14px; }
  .pkg-card { background:#fff; border:1px solid #e8eef0; border-radius:14px; overflow:hidden; transition:.2s; display:flex; flex-direction:column; height:100%; }
  .pkg-card:hover { box-shadow:0 6px 22px rgba(0,0,0,.08); transform:translateY(-2px); }
  .pkg-card-img { width:100%; height:160px; object-fit:cover; background:#f0f4f3; }
  .pkg-card-body { padding:14px; flex:1; display:flex; flex-direction:column; }
  .pkg-price { font-weight:800; color:#0f7b6c; font-size:1.25rem; }
  .badge-verified { background:rgba(34,197,94,.18); border:1px solid rgba(34,197,94,.5); color:#bbf7d0; padding:4px 12px; border-radius:20px; font-size:.78rem; font-weight:700; }
  .badge-pending { background:rgba(234,179,8,.15); border:1px solid rgba(234,179,8,.45); color:#fef08a; padding:4px 12px; border-radius:20px; font-size:.78rem; font-weight:700; }
  .co-tag { display:inline-block; padding:5px 14px; border-radius:20px; font-size:.8rem; font-weight:600; margin:3px; background:#e8f5f0; color:#0f7b6c; }
  .co-dest-tag { background:#f4f6fb; color:#1a2c5b; border:1px solid #dee2e6; }
  .co-gallery-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px; }
  .co-gallery-grid img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:10px; cursor:pointer; transition:.2s; }
  .co-gallery-grid img:hover { transform:scale(1.03); box-shadow:0 4px 16px rgba(0,0,0,.15); }
</style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" href="/"><img src="/logo.png" alt="Guideon" height="52"></a>
    <div class="ms-auto d-flex gap-2 align-items-center">
      <button class="btn btn-sm btn-outline-light" onclick="I18N.toggle()">🌐 EN</button>
      <a href="/search.html" class="btn btn-sm btn-outline-light">← العودة للبحث</a>
    </div>
  </div>
</nav>

<div id="loadingState" class="text-center py-5 text-muted">
  <div class="spinner-border" role="status"></div>
  <div class="mt-3">جارٍ تحميل ملف الشركة…</div>
</div>

<div id="errorState" class="d-none text-center py-5">
  <h2>⚠️</h2>
  <p>تعذّر العثور على هذه الشركة.</p>
  <a href="/search.html" class="btn btn-teal btn">عودة للبحث</a>
</div>

<div id="pageContent" class="d-none">
  <div class="co-hero">
    <div class="container">
      <div class="row align-items-center gy-3">
        <div class="col-md-auto">
          <div class="co-avatar" id="cAvatar">🏢</div>
        </div>
        <div class="col-md">
          <h1 class="fw-800 mb-2" id="cName" style="font-size:1.8rem">—</h1>
          <div class="d-flex flex-wrap gap-2 mb-2" id="cBadges"></div>
          <div class="small" style="opacity:.85" id="cRegNo"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="container py-4">
    <div class="row">
      <div class="col-lg-8">
        <div class="info-card">
          <h5>🏢 <span>عن الشركة</span></h5>
          <p id="cDescription" class="text-muted mb-0" style="line-height:1.8">—</p>
        </div>

        <div class="info-card d-none" id="cServicesCard">
          <h5>✨ <span>الخدمات المقدمة</span></h5>
          <div id="cServices"></div>
        </div>

        <div class="info-card d-none" id="cDestsCard">
          <h5>📍 <span>الوجهات المغطاة</span></h5>
          <div id="cDestinations"></div>
        </div>

        <div class="info-card d-none" id="cGalleryCard">
          <h5>📸 <span>معرض الصور</span></h5>
          <div id="cGallery" class="co-gallery-grid"></div>
        </div>

        <div class="info-card d-none" id="cVideoCard">
          <h5>🎬 <span>فيديو تعريفي</span></h5>
          <div id="cVideo"></div>
        </div>

        <div class="info-card">
          <h5>🗺️ <span>الرحلات المتاحة</span></h5>
          <div id="cPackages" class="row g-3">
            <div class="col-12 text-center py-4 text-muted small">جارٍ التحميل…</div>
          </div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="info-card" style="position:sticky;top:80px">
          <h5>📞 <span>التواصل</span></h5>
          <div id="cContact"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script defer src="/js/bootstrap.bundle.min.js"></script>
<script src="/js/i18n.js?v=39"></script>
<script>
let COMPANY = null;

async function init() {
  const id = new URLSearchParams(location.search).get('id');
  if (!id) { showError(); return; }
  try {
    const [coRes, pkgRes] = await Promise.all([
      fetch('/api/companies/' + id, { credentials: 'include' }),
      fetch('/api/packages?providerId=' + encodeURIComponent(id), { credentials: 'include' }),
    ]);
    if (!coRes.ok) { showError(); return; }
    const co = await coRes.json();
    if (!co.success) { showError(); return; }
    COMPANY = co.company;

    let packages = [];
    try { const pkg = await pkgRes.json(); packages = pkg.packages || []; } catch {}

    render(packages);
    document.getElementById('loadingState').classList.add('d-none');
    document.getElementById('pageContent').classList.remove('d-none');
  } catch (e) {
    console.error(e);
    showError();
  }
}

function showError() {
  document.getElementById('loadingState').classList.add('d-none');
  document.getElementById('errorState').classList.remove('d-none');
}

function esc(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function getYouTubeEmbed(url) {
  let id;
  try {
    const u = new URL(url);
    if (u.hostname.includes('youtube.com')) id = u.searchParams.get('v');
    else if (u.hostname === 'youtu.be') id = u.pathname.slice(1);
  } catch {}
  return id ? `https://www.youtube.com/embed/${id}` : null;
}

function render(packages) {
  document.title = (COMPANY.companyName || 'Company') + ' — Guideon';
  document.getElementById('cName').textContent = COMPANY.companyName || COMPANY.fullName || '—';
  if (COMPANY.photo) {
    document.getElementById('cAvatar').innerHTML = `<img src="${COMPANY.photo}" alt="logo">`;
  }
  const badges = document.getElementById('cBadges');
  if (COMPANY.isVerified) badges.innerHTML += '<span class="badge-verified">✓ شركة موثّقة</span>';
  else badges.innerHTML += '<span class="badge-pending">قيد المراجعة</span>';

  document.getElementById('cRegNo').textContent =
    COMPANY.companyRegNo ? 'سجل تجاري: ' + COMPANY.companyRegNo : '';
  document.getElementById('cDescription').textContent =
    COMPANY.companyDescription || 'لم يقم هذا الشريك بإضافة وصف بعد.';

  // Services
  const svcs = Array.isArray(COMPANY.companyServices) ? COMPANY.companyServices.filter(Boolean) : [];
  if (svcs.length) {
    document.getElementById('cServices').innerHTML = svcs.map(s => `<span class="co-tag">✨ ${esc(s)}</span>`).join('');
    document.getElementById('cServicesCard').classList.remove('d-none');
  }

  // Destinations
  const dests = Array.isArray(COMPANY.companyDestinations) ? COMPANY.companyDestinations.filter(Boolean) : [];
  if (dests.length) {
    document.getElementById('cDestinations').innerHTML = dests.map(d => `<span class="co-tag co-dest-tag">📍 ${esc(d)}</span>`).join('');
    document.getElementById('cDestsCard').classList.remove('d-none');
  }

  // Photo gallery
  const gallery = Array.isArray(COMPANY.galleryPhotos) ? COMPANY.galleryPhotos.filter(Boolean) : [];
  if (gallery.length) {
    document.getElementById('cGallery').innerHTML = gallery.map(url =>
      `<img loading="lazy" src="${url}" alt="" onclick="window.open('${url}','_blank')">`
    ).join('');
    document.getElementById('cGalleryCard').classList.remove('d-none');
  }

  // Video
  if (COMPANY.videoUrl) {
    const embed = getYouTubeEmbed(COMPANY.videoUrl);
    if (embed) {
      document.getElementById('cVideo').innerHTML =
        `<div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:10px">
          <iframe src="${embed}" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0" allowfullscreen loading="lazy"></iframe>
         </div>`;
      document.getElementById('cVideoCard').classList.remove('d-none');
    }
  }

  // Contact card
  const contact = document.getElementById('cContact');
  const items = [];
  if (COMPANY.phone) items.push(`<div class="mb-2"><strong>📞 الهاتف:</strong><br><a href="tel:${COMPANY.phone}">${COMPANY.phone}</a></div>`);
  if (COMPANY.email) items.push(`<div class="mb-2"><strong>✉️ البريد:</strong><br>${COMPANY.email}</div>`);
  if (COMPANY.phone) items.push(`<a class="btn btn-success w-100 mt-2" href="https://wa.me/${COMPANY.phone.replace(/[^0-9]/g,'')}" target="_blank">💬 تواصل عبر واتساب</a>`);
  contact.innerHTML = items.join('') || '<div class="text-muted small">لا توجد معلومات تواصل عامة.</div>';

  // Packages — image-first card grid (much more visual than text list)
  const pkgEl = document.getElementById('cPackages');
  if (!packages.length) {
    pkgEl.innerHTML = '<div class="col-12 text-center py-4 text-muted small">لا توجد رحلات منشورة حالياً.</div>';
    return;
  }
  pkgEl.innerHTML = packages.map(p => {
    const cover = p.cover_image || (Array.isArray(p.images) && p.images[0]) || '';
    return `
    <div class="col-md-6">
      <div class="pkg-card">
        ${cover
          ? `<img class="pkg-card-img" src="${esc(cover)}" alt="" loading="lazy">`
          : `<div class="pkg-card-img" style="display:flex;align-items:center;justify-content:center;font-size:2.5rem;color:#9aa3b2">🗺️</div>`}
        <div class="pkg-card-body">
          <div class="fw-800 mb-1" style="font-size:1.05rem">${esc(p.title)}</div>
          <div class="small text-muted mb-2">📍 ${esc(p.destination || '—')}</div>
          ${p.description ? `<p class="small text-muted mb-2" style="line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(p.description)}</p>` : ''}
          ${Array.isArray(p.includes) && p.includes.length ? `<div class="small mb-2" style="color:#0f7b6c"><strong>يشمل:</strong> ${p.includes.slice(0,3).map(esc).join(' · ')}</div>` : ''}
          <div class="d-flex justify-content-between align-items-center mt-auto pt-2">
            <div class="pkg-price">OMR ${p.price_adult || '—'}</div>
            <a class="btn btn-teal btn-sm" href="/tour-package.html?id=${p.id}">عرض التفاصيل ←</a>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

init();
</script>
<script src="/js/pwa.js?v=14"></script>
<script src="/js/common-widgets.js?v=9"></script>
</body>
</html>
