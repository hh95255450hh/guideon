<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<link rel="preload" as="script" href="/js/common-widgets.js?v=32">
<link rel="stylesheet" href="/css/gd-instant.css?v=1">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Explore Oman by Region — Guideon</title>
<meta name="description" content="Discover Oman's 11 governorates — Muscat, Musandam, Dhofar, Nizwa and more. Curated guides, top sites, best time to visit, and local experts in each region.">
<link rel="icon" href="/logo.png">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/css/bootstrap.min.css">
<style>
  :root{ --ink:#0f1c3e; --teal:#0f7b6c; --sand:#c9a227; --line:#e8ecf1; --muted:#6b7280 }
  body{font-family:'Inter','Tajawal',sans-serif;background:#fff;color:var(--ink)}
  html[dir="rtl"] body{font-family:'Tajawal','Inter',sans-serif}

  /* ── Hero: the country itself, not a gradient ─────────────────────── */
  .p-stats{display:flex;flex-wrap:wrap;gap:28px;margin-top:26px}
  .p-stats b{display:block;font-size:clamp(1.5rem,3.4vw,2.2rem);font-weight:800;line-height:1}
  .p-stats span{font-size:.85rem;opacity:.85;letter-spacing:.04em}

  /* ── Control bar: pick a region by what you want to see ───────────── */
  .controls{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.93);backdrop-filter:blur(10px);
            border-bottom:1px solid var(--line);padding:14px 0}
  .controls .row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
  .controls input{flex:1 1 220px;min-width:180px;border:1px solid var(--line);border-radius:999px;padding:10px 18px;font-size:.95rem;outline:none}
  .controls input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,123,108,.12)}
  .taste{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;flex:1 1 320px;min-width:0;max-width:100%}
  .taste::-webkit-scrollbar{display:none}
  .taste button{white-space:nowrap;background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:600;font-size:.88rem;
                padding:8px 15px;border-radius:999px;cursor:pointer;transition:.18s}
  .taste button:hover{border-color:var(--teal);color:var(--teal)}
  .taste button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .taste button .n{opacity:.6;font-size:.78rem;margin-inline-start:4px}

  /* ── Editorial mosaic of the governorates ─────────────────────────── */
  .r-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:18px;padding:34px 0 10px;grid-auto-flow:dense}
  .r-tile{position:relative;grid-column:span 2;aspect-ratio:4/3;border-radius:18px;overflow:hidden;text-decoration:none;color:#fff;
          background:#0f1c3e;display:block;transition:transform .3s,box-shadow .3s}
  .r-tile.wide{grid-column:span 3;aspect-ratio:16/9}
  .r-tile.tall{grid-column:span 3;aspect-ratio:16/10}
  .r-tile:hover{transform:translateY(-5px);box-shadow:0 20px 44px rgba(15,28,62,.22)}
  .r-tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .7s ease}
  .r-tile:hover img{transform:scale(1.07)}
  .r-tile .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,18,40,.05) 35%,rgba(10,18,40,.86))}
  .r-tile .pin{position:absolute;top:14px;inset-inline-end:14px;background:rgba(255,255,255,.95);color:var(--ink);
          font-size:11.5px;font-weight:800;padding:5px 11px;border-radius:999px;display:flex;gap:6px;align-items:center}
  .r-tile .txt{position:absolute;inset-inline:0;bottom:0;padding:20px}
  .r-tile h3{font-size:clamp(1.15rem,2.2vw,1.6rem);font-weight:800;margin:0;text-shadow:0 2px 10px rgba(0,0,0,.4)}
  .r-tile .sub{font-size:.9rem;opacity:.92;margin:4px 0 0}
  /* Revealed on hover (and always on touch): what the place is actually known for. */
  .r-tile .peek{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;max-height:0;opacity:0;overflow:hidden;
          transition:max-height .35s ease,opacity .25s ease}
  .r-tile:hover .peek,.r-tile:focus-visible .peek{max-height:70px;opacity:1}
  .r-tile .peek span{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(4px);
          font-size:.76rem;font-weight:600;padding:4px 9px;border-radius:999px}
  .r-tile .when{position:absolute;top:14px;inset-inline-start:14px;background:rgba(201,162,39,.95);color:#2a2100;
          font-size:11px;font-weight:800;padding:5px 10px;border-radius:999px;display:none}
  .r-tile.in-season .when{display:block}
  /* A touch screen has no hover, so the site names show by default there. */
  @media(hover:none){ .r-tile .peek{max-height:70px;opacity:1} }
  @media(max-width:900px){ .r-grid{grid-template-columns:repeat(2,1fr)} .r-tile,.r-tile.wide,.r-tile.tall{grid-column:span 1;aspect-ratio:4/3} }
  @media(max-width:560px){ .r-grid{grid-template-columns:1fr} }
  .none{display:none;text-align:center;color:var(--muted);padding:40px 0}

  /* ── Map of Oman ──────────────────────────────────────────────────── */
  .map-sec{padding:50px 0 70px;border-top:1px solid var(--line);margin-top:34px}
  .sec-head h2{font-size:clamp(1.4rem,3vw,1.9rem);font-weight:800;margin:0}
  .sec-head h2::after{content:"";display:block;width:46px;height:3px;background:var(--sand);border-radius:3px;margin-top:10px}
  .sec-head p{color:var(--muted);margin:10px 0 20px}
  #omanMap{height:520px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#eef2f7}
  .gov-pin{background:none;border:0}
  .gov-pin .dot{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.96);border:1px solid #dfe6ee;
          border-radius:999px;padding:5px 11px;box-shadow:0 4px 14px rgba(15,28,62,.18);font-weight:800;font-size:12.5px;
          color:#0f1c3e;white-space:nowrap;transition:.18s}
  .gov-pin .dot b{background:var(--teal);color:#fff;border-radius:999px;padding:1px 7px;font-size:11px}
  .gov-pin:hover .dot{transform:translateY(-2px);border-color:var(--teal)}
</style>
<script src="/js/image-compress.js?v=3"></script>
<script src="/js/gd-map.js?v=5" defer></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200&display=swap">
<link rel="stylesheet" href="/css/gd-cine.css?v=4">
<script src="/js/gd-cine.js?v=4" defer></script>
</head>
<body>
<div id="navMount"></div>

<section class="cine cine--page" data-cine data-cine-page="regions" data-cine-word="REGIONS" data-cine-video="/media/hero/hero-4.mp4" data-cine-image="/media/hero/hero-4.jpg">
  <div class="cine-content">
    <h1 class="cine-title cine-in" style="--i:0"><span class="cine-hl" id="pHeroTitle">Explore Oman by Region</span></h1>
    <p class="cine-sub cine-in" style="--i:1" id="pHeroSub">From the fjords of Musandam to the misty mountains of Dhofar — discover all 11 governorates with curated highlights and local experts.</p>
    <div class="p-stats cine-in" style="--i:2" id="pStats"></div>
  </div>
</section>

<div class="controls">
  <div class="container">
    <div class="row2">
      <input id="qBox" type="search" autocomplete="off" placeholder="Search a region or a place…">
      <div class="taste" id="tasteBar"></div>
    </div>
  </div>
</div>

<main class="container">
  <div class="r-grid" id="regionGrid"></div>
  <p class="none" id="noHit"></p>

  <section class="map-sec">
    <div class="sec-head">
      <h2 id="hMap">Oman on the map</h2>
      <p id="pMap">Pick a governorate to see its sites and its guides.</p>
    </div>
    <div id="omanMap"></div>
  </section>
</main>

<div id="footerMount"></div>

<script src="/js/common-widgets.js?v=32"></script>
<script>
(async () => {
  const lang = (localStorage.getItem('gd_lang') || (document.documentElement.lang || 'en')).toLowerCase();
  const isAr = lang.startsWith('ar');
  if (isAr) { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; }
  const T = (ar, en) => isAr ? ar : en;

  if (isAr) {
    document.title = 'استكشف عُمان حسب المحافظة — Guideon';
    document.getElementById('pHeroTitle').textContent = 'استكشف عُمان حسب المحافظة';
    document.getElementById('pHeroSub').textContent = 'من أخوار مسندم إلى جبال ظفار الضبابية — إحدى عشرة محافظة، لكلٍّ وجهها وموسمها.';
    document.getElementById('qBox').placeholder = 'ابحث عن محافظة أو موقع…';
    document.getElementById('hMap').textContent = 'عُمان على الخريطة';
    document.getElementById('pMap').textContent = 'اختر محافظة لترى مواقعها ومرشديها.';
  }

  const data = await fetch('/api/content/regions')
    .then(r => r.ok ? r.json() : null)
    .then(j => (j && j.success && j.data) ? j.data : fetch('/data/regions.json').then(r => r.json()))
    .catch(() => fetch('/data/regions.json').then(r => r.json()));
  const regions = (data.regions || []).map(r => ({ ...r, landmarks: Array.isArray(r.landmarks) ? r.landmarks : [] }));

  // ── What each governorate offers, derived from its own landmarks ────
  const TASTE = {
    fort:      { ar:'قلاع وحصون', en:'Forts',     glyph:'🏰' },
    nature:    { ar:'طبيعة',       en:'Nature',    glyph:'🌿' },
    beach:     { ar:'شواطئ',       en:'Beaches',   glyph:'🏖️' },
    mountain:  { ar:'جبال',        en:'Mountains', glyph:'⛰️' },
    desert:    { ar:'صحراء',       en:'Desert',    glyph:'🏜️' },
    heritage:  { ar:'تراث',        en:'Heritage',  glyph:'🗿' },
    museum:    { ar:'متاحف',       en:'Museums',   glyph:'🏛️' },
    religious: { ar:'مساجد',       en:'Religious', glyph:'🕌' },
    culture:   { ar:'ثقافة',       en:'Culture',   glyph:'🎭' },
    city:      { ar:'مدن',         en:'Cities',    glyph:'🏙️' },
  };

  // "October to April", "Khareef season: late June – early September"…
  const MONTHS = ['january','february','march','april','may','june','july','august','september','october','november','december'];
  const AR_MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  function seasonMonths(text) {
    const found = [];
    String(text || '').toLowerCase().replace(/[a-z]+/g, w => { const i = MONTHS.indexOf(w); if (i >= 0) found.push(i); return w; });
    if (!found.length) return null;                       // unparsed → never filtered out
    if (found.length === 1) return [found[0]];
    const [a, b] = [found[0], found[found.length - 1]];
    const out = []; for (let m = a; ; m = (m + 1) % 12) { out.push(m); if (m === b) break; }
    return out;
  }

  const stats = { regions: regions.length, sites: 0, photos: 0 };
  for (const r of regions) {
    r._types = [...new Set(r.landmarks.map(l => l.type).filter(Boolean))];
    r._photos = r.landmarks.filter(l => l.image);
    r._season = seasonMonths(r.best_time_en);
    r._count = r.landmarks.length || r.sites || 0;
    stats.sites += r._count;
    stats.photos += r._photos.length;
  }

  document.getElementById('pStats').innerHTML = [
    [stats.regions, T('محافظة', 'governorates')],
    [stats.sites,   T('موقع سياحي', 'sites of interest')],
    [stats.photos,  T('صورة', 'photographs')],
  ].map(([n, l]) => `<div><b>${n}</b><span>${l}</span></div>`).join('');

  // Hero: a slow cross-fade through the best photos we hold, so the page
  // opens on Oman rather than on a gradient.
  const heroShots = regions.flatMap(r => r._photos.slice(0, 2).map(l => l.image)).slice(0, 6);
  if (heroShots.length) {
    onCine(api => api.setSlides([{ image: '/media/hero/hero-4.jpg', video: '/media/hero/hero-4.mp4' }].concat(heroShots.map(src => ({ image: gdSafeUrl(src) })))));
  }

  // ── Taste chips: only the types that actually exist, with region counts ──
  const tasteCounts = {};
  regions.forEach(r => r._types.forEach(t => { tasteCounts[t] = (tasteCounts[t] || 0) + 1; }));
  const tastes = Object.keys(tasteCounts).filter(t => TASTE[t]).sort((a, b) => tasteCounts[b] - tasteCounts[a]);
  const thisMonth = new Date().getMonth();
  document.getElementById('tasteBar').innerHTML =
    `<button data-t="all" aria-pressed="true">${T('كل المحافظات','All regions')}</button>` +
    `<button data-t="season" aria-pressed="false">☀️ ${T('مناسبة الآن','Good right now')} <span class="n">${isAr?AR_MONTHS[thisMonth]:MONTHS[thisMonth].replace(/^./,c=>c.toUpperCase())}</span></button>` +
    tastes.map(t => `<button data-t="${t}" aria-pressed="false">${TASTE[t].glyph} ${isAr?TASTE[t].ar:TASTE[t].en} <span class="n">${tasteCounts[t]}</span></button>`).join('');

  // ── Tiles ───────────────────────────────────────────────────────────
  const grid = document.getElementById('regionGrid');
  const noHit = document.getElementById('noHit');
  noHit.textContent = T('لا محافظة تطابق هذا الاختيار.', 'No region matches that choice.');

  // Largest first: the richest governorates earn the wide tiles.
  const ordered = [...regions].sort((a, b) => b._photos.length - a._photos.length || b._count - a._count);
  const SHAPE = ['wide', 'tall', '', '', '', '', 'wide', '', '', '', ''];

  grid.innerHTML = ordered.map((r, i) => {
    const name = gdEsc(isAr ? r.name_ar : r.name_en);
    const tagline = gdEsc(isAr ? (r.tagline_ar || '') : (r.tagline_en || ''));
    const cover = r._photos[0]?.image || r.hero || '';
    const peek = r.landmarks.filter(l => l.image).slice(0, 3)
      .map(l => `<span>${gdEsc(isAr ? (l.name_ar || l.name_en) : (l.name_en || l.name_ar))}</span>`).join('');
    const inSeason = r._season ? r._season.includes(thisMonth) : false;
    return `<a class="r-tile ${SHAPE[i] || ''} ${inSeason ? 'in-season' : ''}" href="/region.html?id=${encodeURIComponent(r.id)}"
       data-types="${gdEsc(r._types.join(' '))}" data-season="${inSeason ? '1' : '0'}"
       data-hay="${gdEsc([r.name_ar, r.name_en, ...r.landmarks.map(l => l.name_ar), ...r.landmarks.map(l => l.name_en)].join(' ').toLowerCase())}">
      ${cover ? `<img src="${gdSafeUrl(cover)}" alt="${name}" loading="lazy" decoding="async">` : ''}
      <div class="veil"></div>
      <div class="when">☀️ ${T('موسمها الآن','In season')}</div>
      <div class="pin">📍 ${r._count} ${T('موقع','sites')}</div>
      <div class="txt">
        <h3>${name}</h3>
        <p class="sub">${tagline}</p>
        <div class="peek">${peek}</div>
      </div>
    </a>`;
  }).join('');

  // ── Filtering: taste chips + free text, applied together ────────────
  let taste = 'all';
  const apply = () => {
    const q = document.getElementById('qBox').value.trim().toLowerCase();
    let shown = 0;
    [...grid.children].forEach(tile => {
      const okTaste = taste === 'all'
        || (taste === 'season' ? tile.dataset.season === '1' : tile.dataset.types.split(' ').includes(taste));
      const okText = !q || tile.dataset.hay.includes(q);
      const on = okTaste && okText;
      tile.style.display = on ? '' : 'none';
      if (on) shown++;
    });
    noHit.style.display = shown ? 'none' : 'block';
  };
  document.getElementById('tasteBar').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    [...e.currentTarget.children].forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    taste = b.dataset.t; apply();
  });
  document.getElementById('qBox').addEventListener('input', apply);

  // ── Map of Oman: one pin per governorate, placed on its own sites ────
  const pinned = regions.map(r => {
    const pts = r.landmarks.filter(l => Number.isFinite(l.lat) && Number.isFinite(l.lng));
    if (!pts.length) return null;
    return {
      r,
      lat: pts.reduce((a, l) => a + l.lat, 0) / pts.length,
      lng: pts.reduce((a, l) => a + l.lng, 0) / pts.length,
    };
  }).filter(Boolean);

  const drawMap = (tries = 0) => {
    if (!(window.gdMap && window.gdMap.loadLeaflet)) {
      if (tries < 50) return setTimeout(() => drawMap(tries + 1), 100);
      document.getElementById('omanMap').innerHTML =
        `<div class="text-center text-muted py-5">${T('تعذّر تحميل الخريطة.','Map could not load.')}</div>`;
      return;
    }
    window.gdMap.loadLeaflet().then(L => {
      const map = L.map('omanMap', { scrollWheelZoom: false }).setView([21.0, 57.0], 6);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors', maxZoom: 19,
      }).addTo(map);
      const bounds = L.latLngBounds([]);
      pinned.forEach(({ r, lat, lng }) => {
        const label = gdEsc(isAr ? r.name_ar : r.name_en);
        const icon = L.divIcon({
          className: 'gov-pin',
          html: `<span class="dot">${label} <b>${r._count}</b></span>`,
          iconSize: [0, 0], iconAnchor: [0, 0],
        });
        L.marker([lat, lng], { icon })
          .addTo(map)
          .on('click', () => { location.href = `/region.html?id=${encodeURIComponent(r.id)}`; });
        bounds.extend([lat, lng]);
      });
      if (bounds.isValid()) map.fitBounds(bounds.pad(0.22));
      setTimeout(() => map.invalidateSize(), 200);
    }).catch(() => {
      document.getElementById('omanMap').innerHTML =
        `<div class="text-center text-muted py-5">${T('تعذّر تحميل الخريطة.','Map could not load.')}</div>`;
    });
  };
  drawMap();
})();
</script>
</body>
</html>
