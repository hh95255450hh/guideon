<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<link rel="preload" as="script" href="/js/common-widgets.js?v=21">
<link rel="stylesheet" href="/css/gd-instant.css?v=1">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password — Guideon</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="stylesheet" href="/css/bootstrap.min.css">
<link rel="stylesheet" href="/css/style.css?v=40">
<script src="/js/image-compress.js?v=3"></script>
</head>
<body>

<nav class="navbar navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" href="/"><img src="/logo.png" alt="Guideon" height="52"></a>
  </div>
</nav>

<div class="container" style="max-width:480px;margin-top:60px;">
  <div class="card shadow-sm">
    <div class="card-body p-4 p-md-5">
      <h2 class="mb-2" data-i18n="reset_title">Reset Password</h2>
      <p class="text-muted mb-4" data-i18n="reset_subtitle">Choose a new password for your account.</p>

      <div id="alertBox"></div>

      <form id="resetForm">
        <div class="mb-3">
          <label class="form-label" data-i18n="new_password">New Password</label>
          <input type="password" id="newPassword" class="form-control form-control-lg" required minlength="8">
          <small class="text-muted">At least 8 characters</small>
        </div>
        <div class="mb-3">
          <label class="form-label" data-i18n="confirm_password">Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-control form-control-lg" required minlength="8">
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-100" id="submitBtn">
          <span data-i18n="reset_submit">Reset Password</span>
        </button>
      </form>
    </div>
  </div>
</div>

<script src="/js/i18n.js"></script>
<script>
const token = new URLSearchParams(window.location.search).get('token');
if (!token) {
  document.getElementById('alertBox').innerHTML = '<div class="alert alert-danger">No reset token. Please use the link from your email.</div>';
  document.getElementById('resetForm').style.display = 'none';
}

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  const alertBox = document.getElementById('alertBox');

  if (newPassword !== confirmPassword) {
    alertBox.innerHTML = '<div class="alert alert-danger">Passwords do not match.</div>';
    return;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '...';

  try {
    const res = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ token, newPassword }),
    });
    const data = await res.json();
    if (data.success) {
      alertBox.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
      setTimeout(() => window.location.href = '/login.html', 2000);
    } else {
      alertBox.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
    }
  } catch (err) {
    alertBox.innerHTML = '<div class="alert alert-danger">Network error. Please try again.</div>';
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<span data-i18n="reset_submit">Reset Password</span>';
  }
});
</script>
<script src="/js/common-widgets.js?v=21"></script>
</body></html>
