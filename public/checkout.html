<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f7b6c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Guideon">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="shortcut icon" href="/favicon.ico">
<title>Complete Payment — Guideon</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="/css/style.css?v=14">
<style>
  body { background: var(--bg); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .pay-card { background: #fff; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.12); width: 100%; max-width: 480px; overflow: hidden; }
  .pay-header { background: linear-gradient(135deg, var(--teal-dark), var(--teal)); padding: 28px 32px; color: #fff; }
  .pay-header .logo { font-size: 1.3rem; font-weight: 800; margin-bottom: 16px; }
  .pay-row { display: flex; justify-content: space-between; font-size: 14px; padding: 5px 0; opacity: .9; }
  .pay-row.total { border-top: 1px solid rgba(255,255,255,.3); margin-top: 10px; padding-top: 10px; font-weight: 700; font-size: 1.1rem; opacity: 1; }
  .pay-body { padding: 28px 32px; }
  .card-field { border: 1.5px solid var(--border); border-radius: 10px; padding: 12px 16px; font-size: 14px; font-family: 'Courier New', monospace; letter-spacing: 2px; width: 100%; outline: none; transition: border-color .2s; }
  .card-field:focus { border-color: var(--teal); }
  .pay-btn { width: 100%; padding: 14px; background: var(--teal); color: #fff; border: none; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background .2s; }
  .pay-btn:hover { background: var(--teal-dark); }
  .pay-btn:disabled { opacity: .6; cursor: not-allowed; }
  .success-screen { text-align: center; padding: 48px 32px; display: none; }
  .success-icon { width: 72px; height: 72px; background: #e8f5ee; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 2.2rem; }
  .skeleton { background: linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 6px; height: 14px; margin-bottom: 10px; }
  @keyframes shimmer { to { background-position: -200% 0; } }
</style>
</head>
<body>

<div class="pay-card" id="mainCard">

  <!-- Loading -->
  <div id="loadScreen" style="padding:40px 32px">
    <div class="skeleton" style="width:40%;margin-bottom:20px"></div>
    <div class="skeleton"></div><div class="skeleton" style="width:80%"></div><div class="skeleton" style="width:60%"></div>
  </div>

  <!-- Payment form -->
  <div id="payScreen" style="display:none">
    <div class="pay-header">
      <div class="logo"><img src="/logo.png" alt="Guideon" height="52"></div>
      <h6 class="mb-3">Order Summary</h6>
      <div class="pay-row"><span id="sGuideName">Guide</span><span></span></div>
      <div class="pay-row"><span>Date</span><span id="sDate">—</span></div>
      <div class="pay-row"><span>Duration</span><span id="sDuration">—</span></div>
      <div class="pay-row"><span>Participants</span><span id="sParticipants">—</span></div>
      <div class="pay-row total"><span>Total</span><span id="sTotal">—</span></div>
    </div>
    <div class="pay-body">
      <div id="errMsg" class="alert alert-danger d-none mb-3"></div>
      <form id="payForm" onsubmit="submitPayment(event)">
        <div class="mb-3">
          <label class="form-label fw-600 small text-muted">Card Number</label>
          <input class="card-field" id="cardNum" placeholder="4242 4242 4242 4242" maxlength="19" oninput="fmtCard(this)" required>
        </div>
        <div class="row g-2 mb-3">
          <div class="col-7">
            <label class="form-label fw-600 small text-muted">Expiry</label>
            <input class="card-field" id="cardExp" placeholder="MM / YY" maxlength="7" oninput="fmtExp(this)" required>
          </div>
          <div class="col-5">
            <label class="form-label fw-600 small text-muted">CVV</label>
            <input class="card-field" id="cardCvv" placeholder="123" maxlength="3" type="password" required>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-600 small text-muted">Name on Card</label>
          <input class="form-control" id="cardName" placeholder="Your Full Name" required>
        </div>
        <button type="submit" class="pay-btn" id="payBtn">💳 Pay Now</button>
        <div class="text-center mt-3 small text-muted">🔒 Demo payment — no real charge will occur</div>
      </form>
    </div>
  </div>

  <!-- Success -->
  <div class="success-screen" id="successScreen">
    <div class="success-icon">✅</div>
    <h3 class="fw-800 mb-2" style="color:var(--teal)">Payment Successful!</h3>
    <p class="text-muted mb-3">Your tour is confirmed. Enjoy your Oman adventure!</p>
    <div style="background:#f8f9fa;border-radius:10px;padding:14px;font-size:13px;color:#555;word-break:break-all" id="bookingIdDisplay"></div>
    <a href="/tourist-dashboard.html" class="btn-teal btn mt-4 px-4">View My Bookings</a>
  </div>

</div>

<script>
const qs = (p) => new URLSearchParams(window.location.search).get(p);

async function api(method, url, body) {
  const r = await fetch(url, { method, credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json();
  if (!r.ok) throw new Error(d.message || 'Error');
  return d;
}

let BOOKING = null;

(async () => {
  const bookingId = qs('booking_id');
  if (!bookingId) {
    document.getElementById('loadScreen').innerHTML = '<p class="text-danger p-4">Missing booking ID. <a href="/tourist-dashboard.html">Go back</a></p>';
    return;
  }

  try {
    // Load booking info
    const d = await api('GET', '/api/bookings/mine');
    BOOKING = (d.bookings || []).find(b => b.id === bookingId);
    if (!BOOKING) throw new Error('Booking not found');
    if (BOOKING.status === 'cancelled') throw new Error('This booking is cancelled.');

    document.getElementById('sGuideName').textContent = BOOKING.guideName || 'Guide';
    document.getElementById('sDate').textContent = BOOKING.tourDate;
    document.getElementById('sDuration').textContent = BOOKING.duration === 'half' ? 'Half Day' : 'Full Day';
    document.getElementById('sParticipants').textContent = BOOKING.participants + ' person(s)';
    document.getElementById('sTotal').textContent = 'OMR ' + BOOKING.totalAmount;

    document.getElementById('loadScreen').style.display = 'none';
    document.getElementById('payScreen').style.display = 'block';
  } catch (err) {
    document.getElementById('loadScreen').innerHTML = `<p class="text-danger p-4">${err.message} <a href="/tourist-dashboard.html">Go back</a></p>`;
  }
})();

function fmtCard(el) {
  let v = el.value.replace(/\D/g,'');
  el.value = v.replace(/(.{4})/g,'$1 ').trim().slice(0,19);
}
function fmtExp(el) {
  let v = el.value.replace(/\D/g,'');
  if (v.length >= 2) v = v.slice(0,2) + ' / ' + v.slice(2,4);
  el.value = v;
}

async function submitPayment(e) {
  e.preventDefault();
  const btn = document.getElementById('payBtn');
  const err = document.getElementById('errMsg');
  err.classList.add('d-none');
  btn.disabled = true;
  btn.textContent = '⏳ Processing...';

  // Validate demo card
  const num = document.getElementById('cardNum').value.replace(/\s/g,'');
  if (num.length < 16) {
    err.textContent = 'Please enter a valid 16-digit card number.';
    err.classList.remove('d-none');
    btn.disabled = false; btn.textContent = '💳 Pay Now'; return;
  }

  // Simulate payment delay
  await new Promise(r => setTimeout(r, 1800));

  try {
    // Mark booking as completed (simulated payment success)
    await api('PATCH', `/api/bookings/${BOOKING.id}`, { status: 'completed' });
    document.getElementById('payScreen').style.display = 'none';
    document.getElementById('successScreen').style.display = 'block';
    document.getElementById('bookingIdDisplay').innerHTML = `Booking ID: <strong>${BOOKING.id}</strong>`;
  } catch (err2) {
    err.textContent = err2.message;
    err.classList.remove('d-none');
    btn.disabled = false; btn.textContent = '💳 Pay Now';
  }
}
</script>
<script src="/js/pwa.js?v=12"></script>
</body>
</html>
