<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot Password — Guideon</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="stylesheet" href="/css/bootstrap.min.css">
<link rel="stylesheet" href="/css/style.css?v=39">
</head>
<body>

<nav class="navbar navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" href="/"><img src="/logo.png" alt="Guideon" height="52"></a>
  </div>
</nav>

<div class="container" style="max-width:480px;margin-top:60px;">
  <div class="card shadow-sm">
    <div class="card-body p-4 p-md-5">
      <h2 class="mb-2" data-i18n="forgot_title">Forgot Password</h2>
      <p class="text-muted mb-4" data-i18n="forgot_subtitle">Enter your email and we'll send you a link to reset your password.</p>

      <div id="alertBox"></div>

      <form id="forgotForm">
        <div class="mb-3">
          <label class="form-label" data-i18n="email">Email</label>
          <input type="email" id="email" class="form-control form-control-lg" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-100" id="submitBtn">
          <span data-i18n="forgot_send">Send Reset Link</span>
        </button>
      </form>

      <div class="text-center mt-3">
        <a href="/login.html" data-i18n="back_to_login">← Back to Login</a>
      </div>
    </div>
  </div>
</div>

<script src="/js/i18n.js"></script>
<script>
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const btn = document.getElementById('submitBtn');
  const alertBox = document.getElementById('alertBox');
  btn.disabled = true;
  btn.textContent = '...';
  try {
    const res = await fetch('/api/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ email }),
    });
    const data = await res.json();
    alertBox.innerHTML = `<div class="alert alert-${data.success ? 'success' : 'danger'}">${data.message}</div>`;
  } catch (err) {
    alertBox.innerHTML = `<div class="alert alert-danger">Network error. Please try again.</div>`;
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<span data-i18n="forgot_send">Send Reset Link</span>';
  }
});
</script>
<script src="/js/common-widgets.js?v=5"></script>
</body></html>
