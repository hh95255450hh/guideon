<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<link rel="preload" as="script" href="/js/common-widgets.js?v=14">
<link rel="stylesheet" href="/css/gd-instant.css?v=1">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f7b6c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Guideon">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="shortcut icon" href="/favicon.ico">
<title>My Wishlist — Guideon</title>
<script>
/* Bootstrap CSS picker — see i18n.js for the swap logic on lang change */
(function(){
  var s = localStorage.getItem('gd_lang');
  var nav = (navigator.language||'en').slice(0,2).toLowerCase();
  var lang = s || (['en','ar','zh','hi','es','fr','bn','pt','ru','ur'].indexOf(nav)>=0 ? nav : 'en');
  var rtl = lang === 'ar' || lang === 'ur';
  var l = document.createElement('link');
  l.id = rtl ? 'bs-rtl' : 'bs-ltr';
  l.rel = 'stylesheet';
  l.href = rtl ? '/css/bootstrap.rtl.min.css' : '/css/bootstrap.min.css';
  document.head.appendChild(l);
})();
</script>
<link rel="stylesheet" href="/css/style.css?v=40">
<script src="/js/image-compress.js?v=3"></script>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" href="/"><img src="/logo.png" alt="Guideon" height="52"></a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <div class="navbar-controls ms-auto">
        <button class="btn btn-sm btn-outline-light lang-toggle" onclick="I18N.toggle()">🌐 عربي</button>
        <a href="/" class="btn btn-sm btn-outline-light" data-i18n="nav_home">Home</a>
        <a href="/search.html" class="btn btn-sm btn-outline-light" data-i18n="nav_find">Find a Guide</a>
      </div>
    </div>
  </div>
</nav>

<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="section-title mb-0" data-i18n="my_wishlist">❤️ My Wishlist</h2>
    <button class="btn btn-sm btn-outline-danger" onclick="clearWishlist()" data-i18n="clear_wishlist">Clear All</button>
  </div>

  <div id="wishlistGrid" class="row g-4">
    <div class="col-12 text-center py-5 text-muted" data-i18n="loading_guides">Loading...</div>
  </div>
</div>

<div id="toast-container"></div>
<script defer src="/js/bootstrap.bundle.min.js"></script>
<script src="/js/i18n.js?v=44"></script>
<script src="/js/chatbot.js?v=13" defer></script>
<script>
const RATES = { OMR: 1, USD: 2.60, EUR: 2.40, GBP: 2.05 };
function getCurrency() { return localStorage.getItem('gd_currency') || 'OMR'; }
function convertPrice(omr) { const c = getCurrency(); return (omr * RATES[c]).toFixed(2) + ' ' + c; }
function getWishlist() { return JSON.parse(localStorage.getItem('gd_wishlist') || '[]'); }
function saveWishlist(list) { localStorage.setItem('gd_wishlist', JSON.stringify(list)); }
function stars(r) { let s=''; for(let i=1;i<=5;i++) s+=`<span class="${i<=r?'star-full':'star-empty'}">★</span>`; return s; }
function initials(n) { return (n||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2); }

function toast(msg, type='') {
  const el = document.createElement('div');
  el.className = 'toast-msg' + (type ? ' '+type : '');
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function removeFromWishlist(id) {
  let list = getWishlist().filter(x => x !== id);
  saveWishlist(list);
  toast(I18N.t('wishlist_removed'));
  loadWishlist();
}

function clearWishlist() {
  if (!confirm('Remove all saved guides?')) return;
  saveWishlist([]);
  loadWishlist();
}

function getBadge(g) {
  if (g.isVerified && g.rating >= 4.7 && g.totalReviews >= 2) return `<div class="super-guide-medal">${I18N.t('super_guide')}</div>`;
  if (g.totalReviews >= 3 && g.rating >= 4.8) return `<div class="guest-fav-badge">${I18N.t('guest_fav')}</div>`;
  if (g.rating >= 4.5) return `<div class="top-rated-badge">${I18N.t('top_rated')}</div>`;
  if (!g.totalReviews || g.totalReviews === 0) return `<div class="new-guide-badge">${I18N.t('new_guide')}</div>`;
  return '';
}

async function loadWishlist() {
  const ids = getWishlist();
  const grid = document.getElementById('wishlistGrid');

  if (!ids.length) {
    grid.innerHTML = `
      <div class="col-12 text-center py-5">
        <div style="font-size:4rem;margin-bottom:16px">💔</div>
        <h5 class="text-muted" data-i18n="wishlist_empty">${I18N.t('wishlist_empty')}</h5>
        <p class="text-muted" data-i18n="wishlist_empty_sub">${I18N.t('wishlist_empty_sub')}</p>
        <a href="/search.html" class="btn-teal btn mt-3" data-i18n="nav_find">${I18N.t('nav_find')}</a>
      </div>`;
    return;
  }

  grid.innerHTML = `<div class="col-12 text-center py-3 text-muted">Loading saved guides...</div>`;

  try {
    const r = await fetch('/api/guides', { credentials: 'include' });
    const d = await r.json();
    const all = d.guides || [];
    const saved = all.filter(g => ids.includes(g.id));

    if (!saved.length) {
      grid.innerHTML = `<div class="col-12 text-center py-5 text-muted">Saved guides no longer available. <a href="/search.html">Find new guides →</a></div>`;
      return;
    }

    grid.innerHTML = saved.map(g => `
    <div class="col-md-4" id="card-${g.id}">
      <div class="guide-card guide-card-wrap h-100">
        <div class="guide-card-header">
          ${getBadge(g)}
          <button class="wishlist-btn saved" onclick="removeFromWishlist('${g.id}')" title="Remove">
            <span class="heart-icon">♥</span>
          </button>
          <div class="big-avatar">${g.photo ? `<img loading="lazy" decoding="async" src="${window.gdSafeUrl(g.photo)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">` : initials(g.fullName)}</div>
        </div>
        <div class="p-3">
          <div class="d-flex justify-content-between align-items-start mb-1">
            <div>
              <h6 class="mb-0 fw-700">${window.gdEsc(g.fullName)}</h6>
              ${g.isVerified ? `<span class="verified-badge">✓ ${I18N.t('status_verified')}</span>` : ''}
            </div>
            <div class="text-end">
              <div class="fw-800" style="color:var(--teal)">${convertPrice(g.pricePerDay)}</div>
              <div class="text-muted" style="font-size:0.75rem">/day</div>
            </div>
          </div>
          <div class="rating small mb-1">${stars(Math.round(g.rating))} <span class="text-muted">${g.rating} · ${I18N.t('reviews_count', g.totalReviews)}</span></div>
          <div class="mb-2">${(g.languages||[]).map(l=>`<span class="lang-badge me-1">${window.gdEsc(l)}</span>`).join('')}</div>
          <div class="mb-2 small text-muted">📍 ${(g.destinations||[]).join(' · ')}</div>
          <div class="mb-3">${(g.specialisations||[]).slice(0,2).map(s=>`<span class="spec-badge me-1">${s}</span>`).join('')}</div>
          <button class="btn-view btn btn-sm w-100" onclick="location.href='/guide-profile.html?id=${g.id}'">${I18N.t('view_profile')}</button>
        </div>
      </div>
    </div>`).join('');
  } catch {
    grid.innerHTML = '<div class="col-12 text-center text-danger py-4">Could not load saved guides.</div>';
  }
}

window.onLangChange = loadWishlist;
loadWishlist();
</script>
<script src="/js/pwa.js?v=14" defer></script>
<script src="/js/common-widgets.js?v=14"></script>
</body>
</html>
