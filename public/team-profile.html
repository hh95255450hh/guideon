<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>صفحة الفريق — Guideon</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<script>
(function(){var s=localStorage.getItem('gd_lang');var nav=(navigator.language||'en').slice(0,2).toLowerCase();var lang=s||(['en','ar','zh','hi','es','fr','bn','pt','ru','ur'].indexOf(nav)>=0?nav:'en');var rtl=lang==='ar'||lang==='ur';var l=document.createElement('link');l.id=rtl?'bs-rtl':'bs-ltr';l.rel='stylesheet';l.href=rtl?'/css/bootstrap.rtl.min.css':'/css/bootstrap.min.css';document.head.appendChild(l);})();
</script>
<link rel="stylesheet" href="/css/style.css?v=40">
<style>
  .t-hero{background:linear-gradient(135deg,#0a5c50,#0f7b6c);color:#fff;padding:40px 0 30px}
  .ev-card{background:#fff;border:1px solid #e7eaee;border-radius:14px;overflow:hidden;height:100%}
  .cover{height:140px;background:#e2f0ee center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:2.2rem}
  .cat-tag{display:inline-block;background:#f0faf8;color:#0f7b6c;border:1px solid #d6efe9;border-radius:14px;padding:2px 10px;font-size:.72rem;font-weight:700}
  .soc a{display:inline-flex;width:38px;height:38px;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;margin-inline-end:6px;text-decoration:none;font-size:1.1rem}
</style>
<script src="/js/image-compress.js?v=3"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" href="/"><img src="/logo.png" alt="Guideon" height="48"></a>
    <a href="/teams.html" class="btn btn-sm btn-outline-light ms-auto">← كل الفرق</a>
  </div>
</nav>

<div id="content"><div class="text-center py-5 text-muted">جارٍ التحميل…</div></div>

<script src="/js/i18n.js?v=50"></script>
<script src="/js/common-widgets.js?v=14"></script>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CAT={cultural:'🎭 ثقافيّة',sports:'⚽ رياضيّة',music:'🎵 موسيقيّة',adventure:'🏔️ مغامرات',kids:'🧒 أطفال',food:'🍽️ طعام',arts:'🎨 فنون',other:'📦 أخرى'};
const id=new URLSearchParams(location.search).get('id');

async function load(){
  if(!id){ document.getElementById('content').innerHTML='<div class="text-center py-5">رابط غير صالح</div>'; return; }
  try{
    const r=await fetch('/api/teams/'+encodeURIComponent(id));
    const d=await r.json();
    if(!d.success){ throw new Error(d.message); }
    render(d.team, d.events||[]);
  }catch(e){ document.getElementById('content').innerHTML=`<div class="text-center py-5">${esc(e.message||'تعذّر التحميل')}</div>`; }
}

function social(t){
  const s=t.teamSocials||{}; const link=(u,ic)=>u?`<a href="${esc(gdSafeUrl?gdSafeUrl(u):u)}" target="_blank" rel="noopener">${ic}</a>`:'';
  return `<div class="soc mt-2">${link(s.instagram,'📷')}${link(s.youtube,'▶️')}${link(s.tiktok,'🎵')}${link(s.website,'🌐')}</div>`;
}

function render(t, events){
  document.title = (t.teamName||'فريق')+' — Guideon';
  document.getElementById('content').innerHTML = `
    <div class="t-hero">
      <div class="container d-flex align-items-center gap-3 flex-wrap">
        <div style="width:96px;height:96px;border-radius:50%;background:#fff center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:2.4rem;color:#0f7b6c" ${t.photo?`style="background-image:url('${esc(t.photo)}')"`:''}>${t.photo?'':'🎪'}</div>
        <div>
          <h1 class="fw-800 mb-1">${esc(t.teamName||'فريق')} ${t.isVerified?'<span class="badge bg-light text-success">✓ موثّق</span>':''}</h1>
          <div><span class="cat-tag">${esc(CAT[t.teamCategory]||t.teamCategory||'')}</span></div>
          <div class="opacity-90 small mt-1">📍 ${esc(t.teamGovernorate||'عُمان')}${t.membersCount?` · 👥 ${t.membersCount} عضو`:''}${t.foundedYear?` · تأسّس ${t.foundedYear}`:''}</div>
          ${social(t)}
        </div>
      </div>
    </div>
    <div class="container py-4">
      ${t.teamDescription?`<p class="text-muted" style="max-width:720px;line-height:1.8">${esc(t.teamDescription)}</p>`:''}
      <h4 class="fw-700 mt-4 mb-3">🗓️ الفعاليّات القادمة</h4>
      ${events.length?`<div class="row g-3">${events.map(evCard).join('')}</div>`
        :'<div class="text-muted py-3">لا فعاليّات منشورة حالياً.</div>'}
    </div>`;
}
function evCard(e){
  return `<div class="col-md-6 col-lg-4"><div class="ev-card">
    <div class="cover" ${e.coverImage?`style="background-image:url('${esc(e.coverImage)}')"`:''}>${e.coverImage?'':'🎟️'}</div>
    <div class="p-3">
      <span class="cat-tag">${esc(CAT[e.category]||e.category)}</span>
      <h6 class="fw-700 mt-2 mb-1">${esc(e.title)}</h6>
      <div class="small text-muted">${e.eventDate?new Date(e.eventDate).toLocaleDateString('en-GB'):'—'}${e.startTime?` · ${esc(e.startTime)}`:''}</div>
      <div class="small mt-1">📍 ${esc(e.location||e.governorate||'عُمان')} · ${e.ticketPrice>0?`<strong>${e.ticketPrice} ر.ع</strong>`:'<span style="color:#16a34a;font-weight:700">مجّاني</span>'}</div>
      ${e.description?`<p class="small text-muted mt-2 mb-0">${esc(e.description)}</p>`:''}
      ${e.capacity?`<div class="small text-muted mt-1">السعة: ${e.capacity}</div>`:''}
    </div>
  </div></div>`;
}
load();
</script>
</body>
</html>
