<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scan QR — Guideon</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="stylesheet" href="/css/bootstrap.min.css">
<link rel="stylesheet" href="/css/style.css?v=33">
<style>
  body {
    background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy) 45%, var(--teal) 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    color: #fff;
  }
  .qr-wrap {
    background: #fff;
    border-radius: 24px;
    padding: 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    max-width: 460px;
    margin: 0 auto;
    text-align: center;
  }
  .qr-canvas { width: 320px; height: 320px; margin: 16px auto; display: block; position: relative; }
  .qr-img { width: 320px; height: 320px; display: block; margin: 16px auto; border-radius: 8px; }
  .qr-overlay-logo { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60px; height: 60px; background: #fff; padding: 6px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
  .qr-container { position: relative; display: inline-block; }
  .qr-logo { width: 64px; height: 64px; border-radius: 14px; margin-bottom: 12px; }
  .url-pill {
    background: #f0f4f3;
    padding: 10px 16px;
    border-radius: 12px;
    font-family: monospace;
    font-size: .9rem;
    color: var(--teal);
    word-break: break-all;
    display: inline-block;
    margin-top: 12px;
  }
  .action-btn {
    background: var(--teal);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 10px 22px;
    font-weight: 700;
    font-size: .9rem;
    cursor: pointer;
    margin: 4px;
    transition: .2s;
  }
  .action-btn:hover { background: var(--teal-dark); transform: translateY(-2px); }
  .action-btn.outline { background: transparent; border: 2px solid var(--teal); color: var(--teal); }
  .step-card {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    border-radius: 14px;
    padding: 16px 20px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .step-number {
    background: #ffd700;
    color: #1a1a2e;
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; flex-shrink: 0;
  }
</style>
</head>
<body>

<nav class="navbar navbar-dark">
  <div class="container">
    <a class="navbar-brand" href="/"><img src="/logo.png" alt="Guideon" height="44"></a>
    <button class="btn btn-sm btn-outline-light ms-auto" onclick="I18N.toggle()">🌐 عربي</button>
  </div>
</nav>

<div class="container py-5 flex-grow-1">
  <div class="text-center mb-4">
    <h1 class="fw-800 mb-2" data-i18n="qr_title">📱 Open Guideon on Your Phone</h1>
    <p class="opacity-90 mb-0" data-i18n="qr_subtitle">Scan this QR code with your phone's camera to open Guideon instantly.</p>
  </div>

  <div class="qr-wrap">
    <img loading="lazy" decoding="async" src="/logo.png" class="qr-logo" alt="Guideon">
    <h4 class="fw-800" style="color:var(--teal)">Guideon</h4>
    <p class="text-muted small mb-0" data-i18n="qr_tagline">Your local guide to Oman</p>
    <div class="qr-container">
      <img loading="lazy" decoding="async" id="qrImg" class="qr-img" src="https://api.qrserver.com/v1/create-qr-code/?size=320x320&data=https%3A%2F%2Fguideon.guide&color=0f1c3e&bgcolor=ffffff&margin=10&format=png&ecc=H" alt="Guideon QR Code">
      <img loading="lazy" decoding="async" src="/logo.png" class="qr-overlay-logo" alt="Guideon">
    </div>
    <div class="url-pill" id="urlPill">https://guideon.guide</div>
    <div class="mt-3">
      <button class="action-btn" onclick="downloadQR()">⬇️ <span data-i18n="qr_download">Download</span></button>
      <button class="action-btn outline" onclick="copyLink()">🔗 <span data-i18n="qr_copy">Copy Link</span></button>
      <button class="action-btn outline" onclick="shareLink()" id="shareBtn" style="display:none">📤 <span data-i18n="qr_share">Share</span></button>
    </div>
  </div>

  <div class="row mt-5" style="max-width:760px;margin:0 auto">
    <div class="col-12">
      <h5 class="fw-700 mb-3 text-center" data-i18n="qr_howto">📖 How to scan</h5>
    </div>
    <div class="col-md-4">
      <div class="step-card">
        <div class="step-number">1</div>
        <div><strong data-i18n="qr_step1_title">Open Camera</strong><br><small class="opacity-75" data-i18n="qr_step1_desc">On your phone</small></div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="step-card">
        <div class="step-number">2</div>
        <div><strong data-i18n="qr_step2_title">Point at QR</strong><br><small class="opacity-75" data-i18n="qr_step2_desc">Camera will detect it</small></div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="step-card">
        <div class="step-number">3</div>
        <div><strong data-i18n="qr_step3_title">Tap notification</strong><br><small class="opacity-75" data-i18n="qr_step3_desc">Opens guideon.guide</small></div>
      </div>
    </div>
  </div>

  <div class="text-center mt-4">
    <a href="/" class="text-white opacity-75" data-i18n="back_home">← Back to Home</a>
  </div>
</div>

<div id="toast-container"></div>
<script src="/js/bootstrap.bundle.min.js"></script>
<script src="/js/i18n.js?v=36"></script>
<script>
const SITE_URL = window.location.origin || 'https://guideon.guide';
const QR_API = 'https://api.qrserver.com/v1/create-qr-code/?size=320x320&data=' + encodeURIComponent(SITE_URL) + '&color=0f1c3e&bgcolor=ffffff&margin=10&format=png&ecc=H';

document.getElementById('urlPill').textContent = SITE_URL;
document.getElementById('qrImg').src = QR_API;

function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = 'toast-msg' + (type ? ' ' + type : '');
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

async function downloadQR() {
  try {
    const res = await fetch(QR_API);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.download = 'guideon-qr.png';
    link.href = url;
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (e) {
    // Fallback: open in new tab
    window.open(QR_API, '_blank');
  }
}

function copyLink() {
  navigator.clipboard.writeText(SITE_URL).then(() => {
    toast(I18N.t('qr_copied') || 'Link copied!', 'success');
  }).catch(() => {
    toast('Press Ctrl+C to copy: ' + SITE_URL, '');
  });
}

function shareLink() {
  if (navigator.share) {
    navigator.share({ title: 'Guideon', text: 'Your local guide to Oman', url: SITE_URL });
  }
}

if (navigator.share) document.getElementById('shareBtn').style.display = 'inline-block';
</script>
<script src="/js/common-widgets.js?v=2"></script>
</body>
</html>
