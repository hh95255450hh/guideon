<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scan QR — Guideon</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="stylesheet" href="/css/bootstrap.min.css">
<link rel="stylesheet" href="/css/style.css?v=32">
<style>
  body {
    background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy) 45%, var(--teal) 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    color: #fff;
  }
  .qr-wrap {
    background: #fff;
    border-radius: 24px;
    padding: 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    max-width: 460px;
    margin: 0 auto;
    text-align: center;
  }
  .qr-canvas { width: 320px; height: 320px; margin: 16px auto; }
  .qr-logo { width: 64px; height: 64px; border-radius: 14px; margin-bottom: 12px; }
  .url-pill {
    background: #f0f4f3;
    padding: 10px 16px;
    border-radius: 12px;
    font-family: monospace;
    font-size: .9rem;
    color: var(--teal);
    word-break: break-all;
    display: inline-block;
    margin-top: 12px;
  }
  .action-btn {
    background: var(--teal);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 10px 22px;
    font-weight: 700;
    font-size: .9rem;
    cursor: pointer;
    margin: 4px;
    transition: .2s;
  }
  .action-btn:hover { background: var(--teal-dark); transform: translateY(-2px); }
  .action-btn.outline { background: transparent; border: 2px solid var(--teal); color: var(--teal); }
  .step-card {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    border-radius: 14px;
    padding: 16px 20px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .step-number {
    background: #ffd700;
    color: #1a1a2e;
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; flex-shrink: 0;
  }
</style>
</head>
<body>

<nav class="navbar navbar-dark">
  <div class="container">
    <a class="navbar-brand" href="/"><img src="/logo.png" alt="Guideon" height="44"></a>
    <button class="btn btn-sm btn-outline-light ms-auto" onclick="I18N.toggle()">🌐 عربي</button>
  </div>
</nav>

<div class="container py-5 flex-grow-1">
  <div class="text-center mb-4">
    <h1 class="fw-800 mb-2" data-i18n="qr_title">📱 Open Guideon on Your Phone</h1>
    <p class="opacity-90 mb-0" data-i18n="qr_subtitle">Scan this QR code with your phone's camera to open Guideon instantly.</p>
  </div>

  <div class="qr-wrap">
    <img src="/logo.png" class="qr-logo" alt="Guideon">
    <h4 class="fw-800" style="color:var(--teal)">Guideon</h4>
    <p class="text-muted small mb-0" data-i18n="qr_tagline">Your local guide to Oman</p>
    <canvas id="qrCanvas" class="qr-canvas"></canvas>
    <div class="url-pill" id="urlPill">https://guideon.guide</div>
    <div class="mt-3">
      <button class="action-btn" onclick="downloadQR()">⬇️ <span data-i18n="qr_download">Download</span></button>
      <button class="action-btn outline" onclick="copyLink()">🔗 <span data-i18n="qr_copy">Copy Link</span></button>
      <button class="action-btn outline" onclick="shareLink()" id="shareBtn" style="display:none">📤 <span data-i18n="qr_share">Share</span></button>
    </div>
  </div>

  <div class="row mt-5" style="max-width:760px;margin:0 auto">
    <div class="col-12">
      <h5 class="fw-700 mb-3 text-center" data-i18n="qr_howto">📖 How to scan</h5>
    </div>
    <div class="col-md-4">
      <div class="step-card">
        <div class="step-number">1</div>
        <div><strong data-i18n="qr_step1_title">Open Camera</strong><br><small class="opacity-75" data-i18n="qr_step1_desc">On your phone</small></div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="step-card">
        <div class="step-number">2</div>
        <div><strong data-i18n="qr_step2_title">Point at QR</strong><br><small class="opacity-75" data-i18n="qr_step2_desc">Camera will detect it</small></div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="step-card">
        <div class="step-number">3</div>
        <div><strong data-i18n="qr_step3_title">Tap notification</strong><br><small class="opacity-75" data-i18n="qr_step3_desc">Opens guideon.guide</small></div>
      </div>
    </div>
  </div>

  <div class="text-center mt-4">
    <a href="/" class="text-white opacity-75" data-i18n="back_home">← Back to Home</a>
  </div>
</div>

<div id="toast-container"></div>
<script src="/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="/js/i18n.js?v=24"></script>
<script>
const SITE_URL = window.location.origin || 'https://guideon.guide';
document.getElementById('urlPill').textContent = SITE_URL;

const canvas = document.getElementById('qrCanvas');
QRCode.toCanvas(canvas, SITE_URL, {
  width: 320, margin: 2,
  color: { dark: '#0f1c3e', light: '#ffffff' },
  errorCorrectionLevel: 'H',
}, (err) => {
  if (!err) drawLogo();
});

// Overlay logo in middle of QR
function drawLogo() {
  const ctx = canvas.getContext('2d');
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    const size = 60;
    const x = (canvas.width - size) / 2;
    const y = (canvas.height - size) / 2;
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 4, y - 4, size + 8, size + 8);
    ctx.drawImage(img, x, y, size, size);
  };
  img.src = '/logo.png';
}

function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = 'toast-msg' + (type ? ' ' + type : '');
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

function downloadQR() {
  const link = document.createElement('a');
  link.download = 'guideon-qr.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function copyLink() {
  navigator.clipboard.writeText(SITE_URL).then(() => {
    toast(I18N.t('qr_copied') || 'Link copied!', 'success');
  });
}

function shareLink() {
  if (navigator.share) {
    navigator.share({ title: 'Guideon', text: 'Your local guide to Oman', url: SITE_URL });
  }
}

if (navigator.share) document.getElementById('shareBtn').style.display = 'inline-block';
</script>
</body>
</html>
