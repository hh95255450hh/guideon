<script>
/* ── CURRENCY (TourHQ) ── */
const RATES = { OMR: 1, USD: 2.60, EUR: 2.40, GBP: 2.05 };
function getCurrency() { return localStorage.getItem('gd_currency') || 'OMR'; }
function setCurrency(cur) { localStorage.setItem('gd_currency', cur); renderGuides(SHOWING_WISHLIST ? ALL_GUIDES.filter(g => isWishlisted(g.id)) : ALL_GUIDES); }
function convertPrice(omr) {
  const c = getCurrency();
  const v = Number((omr || 0) * RATES[c]).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  const SYM = { OMR: 'OMR', USD: '$', EUR: '€', GBP: '£' };
  return c === 'OMR' ? `${v} OMR` : `${SYM[c]}${v}`;
}
document.addEventListener('DOMContentLoaded', () => { const s = document.getElementById('currencySelect'); if (s) s.value = getCurrency(); });

/* ── WISHLIST stored in localStorage ── */
function getWishlist() { return JSON.parse(localStorage.getItem('gd_wishlist') || '[]'); }
function saveWishlist(list) { localStorage.setItem('gd_wishlist', JSON.stringify(list)); }
function isWishlisted(id) { return getWishlist().includes(id); }
function toggleWishlist(id) {
  let list = getWishlist();
  if (list.includes(id)) {
    list = list.filter(x => x !== id);
    toast(I18N.t('wishlist_removed'));
  } else {
    list.push(id);
    toast(I18N.t('wishlist_saved'), 'success');
  }
  saveWishlist(list);
  document.querySelectorAll(`.wishlist-btn[data-id="${id}"]`).forEach(btn => {
    btn.classList.toggle('saved', list.includes(id));
  });
  updateWishlistBar();
}

let SHOWING_WISHLIST = false;
let ALL_GUIDES = [];
let ACTIVE_CATEGORY = '';

function updateWishlistBar() {
  const count = getWishlist().length;
  document.getElementById('wishlistCountNum').textContent = count;
}

function toggleWishlistView() {
  SHOWING_WISHLIST = !SHOWING_WISHLIST;
  document.getElementById('wishlistBar').classList.toggle('d-none', !SHOWING_WISHLIST);
  if (SHOWING_WISHLIST) renderGuides(ALL_GUIDES.filter(g => isWishlisted(g.id)));
  else renderGuides(ALL_GUIDES);
}

function clearWishlist() {
  saveWishlist([]);
  updateWishlistBar();
  document.querySelectorAll('.wishlist-btn').forEach(b => b.classList.remove('saved'));
  if (SHOWING_WISHLIST) renderGuides([]);
}

/* ── GUESTS ── */
let guestValue = 1;
function changeGuests(delta) {
  guestValue = Math.max(1, Math.min(20, guestValue + delta));
  document.getElementById('guestCount').textContent = guestValue;
  document.getElementById('fGuests').value = guestValue;
}

/* ── CATEGORY TABS ── */
function selectCategory(cat, el) {
  ACTIVE_CATEGORY = cat;
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  loadGuides();
}

/* ── ACTIVE FILTER TAGS ── */
function renderFilterTags(params) {
  const container = document.getElementById('activeFilters');
  container.innerHTML = '';
  const labels = {
    destination: I18N.t('search_dest'),
    language: I18N.t('search_lang'),
    date: I18N.t('search_date'),
    minRating: I18N.t('filter_min_rating'),
    minPrice: I18N.t('min_price'),
    maxPrice: I18N.t('max_price'),
    specialisation: 'Category',
    participants: I18N.t('guests_lbl'),
  };
  for (const [key, val] of params.entries()) {
    if (!val) continue;
    const tag = document.createElement('span');
    tag.className = 'active-filter-tag';
    tag.innerHTML = `${labels[key] || key}: ${val} ✕`;
    tag.onclick = () => { clearParam(key); };
    container.appendChild(tag);
  }
}

function clearParam(key) {
  const map = { destination: 'fDest', language: 'fLang', date: 'fDate', minRating: 'fRating', specialisation: 'fSpec', minPrice: 'fMinPrice', maxPrice: 'fMaxPrice' };
  if (map[key]) document.getElementById(map[key]).value = '';
  if (key === 'participants') { guestValue = 1; document.getElementById('guestCount').textContent = 1; document.getElementById('fGuests').value = 1; }
  loadGuides();
}

/* ── UTILITY ── */
function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = 'toast-msg' + (type ? ' ' + type : '');
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function stars(r) {
  let s = '';
  for (let i = 1; i <= 5; i++) s += `<span class="${i <= r ? 'star-full' : 'star-empty'}">★</span>`;
  return s;
}
function initials(n) { return (n || '?').split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2); }

function getBadge(g) {
  if (g.isVerified && g.rating >= 4.7 && g.totalReviews >= 2) return `<div class="super-guide-medal">${I18N.t('super_guide')}</div>`;
  if (g.totalReviews >= 3 && g.rating >= 4.8) return `<div class="guest-fav-badge">${I18N.t('guest_fav')}</div>`;
  if (g.rating >= 4.5) return `<div class="top-rated-badge">${I18N.t('top_rated')}</div>`;
  if (!g.totalReviews || g.totalReviews === 0) return `<div class="new-guide-badge">${I18N.t('new_guide')}</div>`;
  return '';
}

/* ── SESSION ── */
async function checkSession() {
  try {
    const r = await fetch('/api/auth/me', { credentials: 'include' });
    const d = await r.json();
    if (d.success) {
      document.getElementById('navAuth').classList.add('d-none');
      document.getElementById('navUser').classList.remove('d-none');
      document.getElementById('navName').textContent = d.user.fullName.split(' ')[0];
      const dashMap = { tourist: '/tourist-dashboard.html', guide: '/guide-dashboard.html', admin: '/admin.html' };
      document.getElementById('navDashBtn').href = dashMap[d.user.userType] || '/';
    }
  } catch {}
}

async function doLogout() {
  try { await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' }); } catch {}
  window.location.href = '/';
}

/* ── LOAD GUIDES ── */
// Pagination state — kept simple: append more rows on demand.
let SEARCH_PAGE = 1;
const SEARCH_PAGE_SIZE = 24;
let SEARCH_HAS_MORE = false;

async function loadGuides(append = false) {
  if (!append) { SEARCH_PAGE = 1; ALL_GUIDES = []; }
  const params = new URLSearchParams();
  params.set('page', SEARCH_PAGE);
  params.set('pageSize', SEARCH_PAGE_SIZE);
  const gov       = document.getElementById('fGov').value;
  const dest      = document.getElementById('fDest').value;
  const lang      = document.getElementById('fLang').value;
  const date      = document.getElementById('fDate').value;
  const rating    = document.getElementById('fRating').value;
  const sort      = document.getElementById('fSort').value;
  const minPrice  = document.getElementById('fMinPrice').value;
  const maxPrice  = document.getElementById('fMaxPrice').value;
  const spec      = ACTIVE_CATEGORY || document.getElementById('fSpec').value;
  const guests    = document.getElementById('fGuests').value;

  if (gov)      params.set('governorate', gov);
  if (dest)     params.set('destination', dest);
  if (lang)     params.set('language', lang);
  if (date)     params.set('date', date);
  if (rating)   params.set('minRating', rating);
  if (sort)     params.set('sortBy', sort);
  if (minPrice) params.set('minPrice', minPrice);
  if (maxPrice) params.set('maxPrice', maxPrice);
  if (spec)     params.set('specialisation', spec);
  if (guests && guests > 1) params.set('participants', guests);

  history.replaceState(null, '', '?' + params.toString());
  renderFilterTags(params);

  if (!append) document.getElementById('guideGrid').innerHTML = skeletonCards(6);

  try {
    const r = await fetch('/api/guides?' + params, { credentials: 'include' });
    const data = await r.json();
    const newGuides = data.guides || [];
    ALL_GUIDES = append ? ALL_GUIDES.concat(newGuides) : newGuides;
    window.ALL_GUIDES = ALL_GUIDES;
    SEARCH_HAS_MORE = !!data.hasMore;
    updateWishlistBar();
    renderGuides(SHOWING_WISHLIST ? ALL_GUIDES.filter(g => isWishlisted(g.id)) : ALL_GUIDES);
    renderLoadMore(data.total);
  } catch {
    document.getElementById('guideGrid').innerHTML = '<div class="col-12 text-center text-danger py-4">Error loading guides.</div>';
  }
}

function renderLoadMore(total) {
  let bar = document.getElementById('loadMoreBar');
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'loadMoreBar';
    bar.className = 'text-center py-4';
    document.getElementById('guideGrid').after(bar);
  }
  if (SEARCH_HAS_MORE && !SHOWING_WISHLIST) {
    bar.innerHTML = `<button class="btn btn-outline-teal px-4" onclick="loadMoreGuides()">${I18N.t('load_more') || 'Load more'} ↓</button>
                     <div class="small text-muted mt-2">${ALL_GUIDES.length} / ${total || '?'}</div>`;
  } else {
    bar.innerHTML = '';
  }
}

async function loadMoreGuides() {
  SEARCH_PAGE += 1;
  const btn = document.querySelector('#loadMoreBar button');
  if (btn) { btn.disabled = true; btn.textContent = 'Loading…'; }
  await loadGuides(true);
}

// ── Interactive map (Airbnb-style) ──
let _map = null, _markers = [], _mapReady = false;
function toggleMap() {
  const box = document.getElementById('searchMap');
  const open = box.style.display === 'none';
  box.style.display = open ? 'block' : 'none';
  document.getElementById('mapToggle').classList.toggle('btn-teal', open);
  document.getElementById('mapToggle').classList.toggle('btn-outline-teal', !open);
  if (open) initMap();
}
async function initMap() {
  if (_mapReady) { updateMap(); return; }
  try {
    const L = await window.gdMap.loadLeaflet();
    _map = L.map('searchMap', { scrollWheelZoom: false }).setView(window.OMAN_CENTER || [21.5, 57.5], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap', maxZoom: 18,
    }).addTo(_map);
    _mapReady = true;
    updateMap();
  } catch (e) { console.warn('[map]', e.message); }
}
function updateMap() {
  if (!_mapReady || !_map || !window.L) return;
  _markers.forEach(m => _map.removeLayer(m));
  _markers = [];
  const list = (window.ALL_GUIDES || []).filter(g => !SHOWING_WISHLIST || isWishlisted(g.id));
  const seen = {};
  const bounds = [];
  list.forEach(g => {
    let c = window.gdCoordsFor(g.destinations || []);
    if (!c) return;
    // jitter overlapping markers at the same wilayat so they don't stack
    const key = c.join(',');
    seen[key] = (seen[key] || 0) + 1;
    const n = seen[key] - 1;
    const lat = c[0] + (n ? (Math.cos(n) * 0.03) : 0);
    const lng = c[1] + (n ? (Math.sin(n) * 0.03) : 0);
    const icon = window.L.divIcon({
      className: 'gd-price-pin',
      html: `<div style="background:var(--teal,#0f7b6c);color:#fff;font-weight:800;font-size:.72rem;padding:4px 9px;border-radius:14px;box-shadow:0 3px 10px rgba(0,0,0,.3);white-space:nowrap">${g.pricePerDay ? g.pricePerDay + ' OMR' : '★ ' + (g.rating || '—')}</div>`,
      iconSize: null,
    });
    const m = window.L.marker([lat, lng], { icon }).addTo(_map);
    m.bindPopup(`<div style="text-align:center;min-width:140px">
      <strong>${window.gdEsc(g.fullName)}</strong><br>
      <span style="color:#666;font-size:.85rem">⭐ ${g.rating || '—'} · ${(g.destinations || [])[0] || ''}</span><br>
      <a href="/guide-profile.html?id=${g.id}" style="color:var(--teal);font-weight:700">View profile →</a>
    </div>`);
    _markers.push(m);
    bounds.push([lat, lng]);
  });
  if (bounds.length) _map.fitBounds(bounds, { padding: [40, 40], maxZoom: 9 });
}

// Shimmer placeholder cards shown while results load — feels faster than a spinner.
function skeletonCards(n) {
  let html = '';
  for (let i = 0; i < n; i++) html += `
    <div class="col-md-6 col-lg-4">
      <div class="guide-card h-100">
        <div class="gd-skel" style="height:150px;border-radius:14px 14px 0 0"></div>
        <div class="p-3">
          <div class="gd-skel" style="height:18px;width:60%;margin-bottom:10px"></div>
          <div class="gd-skel" style="height:13px;width:40%;margin-bottom:14px"></div>
          <div class="gd-skel" style="height:24px;width:80%;margin-bottom:14px"></div>
          <div class="gd-skel" style="height:36px;width:100%"></div>
        </div>
      </div>
    </div>`;
  return html;
}

function renderGuides(guides) {
  document.getElementById('resultCount').textContent = guides.length
    ? I18N.t('results_found', guides.length)
    : I18N.t('no_results');

  if (!guides.length) {
    document.getElementById('guideGrid').innerHTML = `
      <div class="col-12 empty-state">
        <div class="icon">${SHOWING_WISHLIST ? '❤️' : '🔍'}</div>
        <h5>${SHOWING_WISHLIST ? I18N.t('wishlist_empty') : I18N.t('no_results')}</h5>
        <p class="text-muted">${SHOWING_WISHLIST ? I18N.t('wishlist_empty_sub') : I18N.t('no_results_sub')}</p>
        ${!SHOWING_WISHLIST ? `<button class="btn-teal btn mt-2" onclick="clearFilters()">${I18N.t('clear_filters')}</button>` : ''}
      </div>`;
    return;
  }

  document.getElementById('guideGrid').innerHTML = guides.map(g => {
    const wishlisted = isWishlisted(g.id);
    const badge = getBadge(g);
    return `
      <div class="col-md-6 col-lg-4">
        <div class="guide-card h-100 guide-card-wrap">
          <!-- Airbnb-style header with avatar -->
          <div class="guide-card-header"${g.photo ? ` data-photo="${window.gdSafeUrl(g.photo)}" data-photo-overlay="1"` : ''}>
            ${badge}
            <button class="wishlist-btn ${wishlisted ? 'saved' : ''}" data-id="${g.id}" onclick="toggleWishlist('${g.id}')" title="${I18N.t('saved_guides')}">
              <span class="heart-icon">${wishlisted ? '♥' : '♡'}</span>
            </button>
            ${g.photo
              ? `<div class="big-avatar" data-photo="${window.gdSafeUrl(g.photo)}" style="background-size:cover;background-position:center;color:transparent;border:3px solid #fff"></div>`
              : `<div class="big-avatar">${initials(g.fullName)}</div>`}
          </div>

          <div class="p-3">
            <div class="d-flex align-items-start justify-content-between mb-1">
              <div>
                <h6 class="mb-0 fw-700">${window.gdEsc(g.fullName)}</h6>
                ${g.isVerified ? `<span class="verified-badge">✓ ${I18N.t('status_verified')}</span>` : ''}
              </div>
            </div>

            <div class="rating small mb-1">
              ${stars(Math.round(g.rating))}
              <span class="text-muted ms-1">${g.rating} · ${I18N.t('reviews_count', g.totalReviews)}</span>
            </div>

            <div class="small text-muted mb-2">📍 ${window.gdEsc((g.destinations||[]).join(', '))}</div>
            <div class="mb-2">${(g.languages||[]).map(l => `<span class="lang-badge me-1">${window.gdEsc(l)}</span>`).join('')}</div>
            <p class="small text-muted mb-3" style="line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${window.gdEsc(g.bio || '')}</p>

            <button class="btn-view btn btn-sm w-100" onclick="location.href='/guide-profile.html?id=${g.id}'">${I18N.t('view_profile')}</button>
          </div>
        </div>
      </div>`;
  }).join('');

  lazyLoadCardPhotos();
  if (document.getElementById('searchMap')?.style.display !== 'none') updateMap();
}

// Lazy-load card photos via IntersectionObserver so off-screen guide
// photos never hit the network — a real Egress saving on long result
// lists, since CSS background-images can't use native loading="lazy".
let _photoObserver;
function lazyLoadCardPhotos() {
  const targets = document.querySelectorAll('[data-photo]');
  if (!('IntersectionObserver' in window)) {
    // Old browser: just load them all immediately.
    targets.forEach(applyPhoto);
    return;
  }
  if (!_photoObserver) {
    _photoObserver = new IntersectionObserver((entries, obs) => {
      entries.forEach(e => { if (e.isIntersecting) { applyPhoto(e.target); obs.unobserve(e.target); } });
    }, { rootMargin: '300px' }); // start loading a bit before they scroll in
  }
  targets.forEach(el => _photoObserver.observe(el));
}
function applyPhoto(el) {
  const url = el.getAttribute('data-photo');
  if (!url) return;
  el.style.backgroundImage = el.hasAttribute('data-photo-overlay')
    ? `linear-gradient(rgba(15,28,62,.25),rgba(15,28,62,.45)),url('${url}')`
    : `url('${url}')`;
  el.style.backgroundSize = 'cover';
  el.style.backgroundPosition = 'center';
  el.removeAttribute('data-photo');
}

function clearFilters() {
  ['fGov','fDest','fLang','fDate','fRating','fSort','fSpec','fMinPrice','fMaxPrice'].forEach(id => document.getElementById(id).value = '');
  if (window.populateWilayats) populateWilayats(document.getElementById('fDest'), null);
  guestValue = 1; document.getElementById('guestCount').textContent = 1; document.getElementById('fGuests').value = 1;
  ACTIVE_CATEGORY = '';
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
  document.querySelector('.cat-tab[data-cat=""]').classList.add('active');
  SHOWING_WISHLIST = false;
  document.getElementById('wishlistBar').classList.add('d-none');
  loadGuides();
}

/* ── Wire cascading governorate ↔ wilayat dropdowns ── */
if (window.linkGovernorateWilayat) {
  linkGovernorateWilayat(
    document.getElementById('fGov'),
    document.getElementById('fDest')
  );
}

/* ── PRE-FILL FROM URL ── */
const urlParams = new URLSearchParams(location.search);
if (urlParams.get('governorate')) {
  document.getElementById('fGov').value = urlParams.get('governorate');
  // Re-populate wilayats for that governorate
  if (window.populateWilayats) populateWilayats(document.getElementById('fDest'), urlParams.get('governorate'));
}
if (urlParams.get('destination')) document.getElementById('fDest').value = urlParams.get('destination');
if (urlParams.get('language'))    document.getElementById('fLang').value = urlParams.get('language');
if (urlParams.get('date'))        document.getElementById('fDate').value = urlParams.get('date');
if (urlParams.get('minRating'))   document.getElementById('fRating').value = urlParams.get('minRating');
if (urlParams.get('sortBy'))      document.getElementById('fSort').value = urlParams.get('sortBy');
if (urlParams.get('minPrice'))    document.getElementById('fMinPrice').value = urlParams.get('minPrice');
if (urlParams.get('maxPrice'))    document.getElementById('fMaxPrice').value = urlParams.get('maxPrice');
if (urlParams.get('specialisation')) {
  document.getElementById('fSpec').value = urlParams.get('specialisation');
  ACTIVE_CATEGORY = urlParams.get('specialisation');
  const matchTab = document.querySelector(`.cat-tab[data-cat="${ACTIVE_CATEGORY}"]`);
  if (matchTab) { document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active')); matchTab.classList.add('active'); }
}
if (urlParams.get('participants')) {
  guestValue = parseInt(urlParams.get('participants')) || 1;
  document.getElementById('guestCount').textContent = guestValue;
  document.getElementById('fGuests').value = guestValue;
}

window.onLangChange = () => loadGuides();

checkSession();
loadGuides();
</script>
