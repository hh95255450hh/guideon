<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<link rel="preload" as="script" href="/js/common-widgets.js?v=29">
<link rel="stylesheet" href="/css/gd-instant.css?v=1">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Region — Guideon</title>
<meta name="description" content="Explore an Omani region — what to see, best time to visit, and verified local guides.">
<link rel="icon" href="/logo.png">
<link rel="stylesheet" href="/css/bootstrap.min.css">
<style>
  body{font-family:'Inter','Tajawal',sans-serif;background:#fff;color:#0f1c3e}
  .r-hero{position:relative;height:60vh;min-height:380px;background:linear-gradient(135deg,#0f1c3e,#0f7b6c);background-size:cover;background-position:center;color:#fff;display:flex;align-items:flex-end}
  .r-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1) 0%,rgba(0,0,0,.7) 100%)}
  .r-hero .container{position:relative;z-index:2;padding-bottom:50px}
  .r-hero h1{font-size:clamp(2.2rem,6vw,4rem);font-weight:800;margin:0;text-shadow:0 2px 12px rgba(0,0,0,.4)}
  .r-hero .tag{font-size:1.2rem;opacity:.95;margin-top:8px;font-weight:500}
  .r-hero .hero-credit{position:absolute;bottom:8px;inset-inline-end:14px;z-index:3;font-size:11px;opacity:.75;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .r-quick{background:#0f7b6c;color:#fff;padding:14px 0;font-size:.95rem}
  .r-quick .item{display:inline-flex;gap:8px;align-items:center;margin-inline-end:24px}
  .r-quick svg{width:18px;height:18px;flex-shrink:0}
  .r-section{padding:50px 0;border-bottom:1px solid #eef0f4}
  .r-section h2{font-size:1.6rem;font-weight:800;margin-bottom:20px;color:#0f1c3e}
  .hl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .hl-card{background:linear-gradient(135deg,#fff,#f7f9fb);border:1px solid #eef0f4;border-radius:12px;padding:18px;display:flex;gap:12px;align-items:flex-start;transition:.2s}
  .hl-card:hover{border-color:#0f7b6c;transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,123,108,.1)}
  .hl-card .dot{width:10px;height:10px;border-radius:50%;background:#0f7b6c;margin-top:6px;flex-shrink:0}
  .hl-card span{font-weight:600;color:#0f1c3e}
  .intro p{font-size:1.05rem;line-height:1.85;color:#374151}
  /* Photo cards, one per landmark. */
  .lm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
  .lm-card{background:#fff;border:1px solid #eef0f4;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:.2s}
  .lm-card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(15,28,62,.1);border-color:#0f7b6c}
  .lm-card .shot{position:relative;height:170px;background:linear-gradient(135deg,#0f1c3e,#15325c);display:flex;align-items:center;justify-content:center}
  .lm-card .shot img{width:100%;height:100%;object-fit:cover;display:block}
  .lm-card .shot .glyph{font-size:2.6rem;opacity:.5}
  .lm-card .kind{position:absolute;top:10px;inset-inline-start:10px;background:rgba(255,255,255,.94);color:#0f1c3e;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
  .lm-card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
  .lm-card h3{font-size:1.02rem;font-weight:800;margin:0;color:#0f1c3e}
  .lm-card .alt{font-size:.82rem;color:#6b7280;margin:0}
  .lm-card .go{margin-top:auto;font-size:.85rem;font-weight:700;color:#0f7b6c;text-decoration:none}
  .lm-card .go:hover{text-decoration:underline}
  /* Credit line: CC photos may be reused commercially only with attribution. */
  .lm-card .credit{font-size:.68rem;color:#9ca3af;margin:0}
  .lm-card .credit a{color:#9ca3af}
  .r-cta{background:linear-gradient(135deg,#0f1c3e,#0f7b6c);color:#fff;padding:50px 0;text-align:center;border-radius:20px;margin:50px 0}
  .r-cta h3{font-size:1.6rem;font-weight:800;margin-bottom:8px}
  .r-cta .btn{background:#fff;color:#0f1c3e;padding:12px 28px;border-radius:999px;font-weight:700;text-decoration:none;display:inline-block;margin-top:12px;transition:.2s}
  .r-cta .btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.2)}
  html[dir="rtl"] body{font-family:'Tajawal','Inter',sans-serif}
</style>
<script src="/js/image-compress.js?v=3"></script>
<script src="/js/gd-map.js?v=3" defer></script>
</head>
<body>
<div id="navMount"></div>

<section class="r-hero" id="rHero">
  <div class="container">
    <h1 id="rName">…</h1>
    <p class="tag" id="rTag"></p>
  </div>
</section>

<div class="r-quick">
  <div class="container">
    <span class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="10" r="3"/><path d="M12 2C8 2 5 5 5 9c0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7z"/></svg><span id="rSites">…</span></span>
    <span class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><span id="rTime">…</span></span>
  </div>
</div>

<main class="container">
  <section class="r-section intro">
    <h2 id="hAbout">About</h2>
    <p id="rIntro"></p>
  </section>

  <section class="r-section">
    <h2 id="hHighlights">Top Highlights</h2>
    <div class="hl-grid" id="rHighlights"></div>
  </section>

  <section class="r-section" id="rMapSection" style="display:none">
    <h2 id="hMap">Map of Landmarks</h2>
    <p id="rMapSub" class="text-muted" style="margin-bottom:14px"></p>
    <div id="rLandmarksMap"></div>
  </section>

  <section class="r-section" id="rCardsSection" style="display:none">
    <h2 id="hCards">Sites to visit</h2>
    <div class="lm-grid" id="rLandmarkCards"></div>
  </section>

  <section class="r-cta">
    <h3 id="cTitle">Find a verified local guide</h3>
    <p id="cSub">Book a Ministry-licensed expert who knows this region inside out.</p>
    <a class="btn" id="cBtn" href="#">→</a>
  </section>
</main>

<div id="footerMount"></div>

<script src="/js/common-widgets.js?v=29"></script>
<script>
(async () => {
  const lang = (localStorage.getItem('gd_lang') || 'en').toLowerCase();
  const isAr = lang.startsWith('ar');
  if (isAr) { document.documentElement.lang='ar'; document.documentElement.dir='rtl'; }
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  // Read BOTH the API content (which may be an older admin-saved copy
  // missing new fields like `landmarks`) and the bundled defaults, then
  // merge per-region so new fields surface even after an admin save.
  const [apiData, staticData] = await Promise.all([
    fetch('/api/content/regions').then(r=>r.ok?r.json():null).then(j=>(j&&j.success&&j.data)?j.data:null).catch(()=>null),
    fetch('/data/regions.json?v=2').then(r=>r.json()).catch(()=>({regions:[]})),
  ]);
  const apiById = {}; (apiData?.regions || []).forEach(x => apiById[x.id] = x);
  const stcById = {}; (staticData?.regions || []).forEach(x => stcById[x.id] = x);
  // Merge: static is the base, API overrides whatever the admin edited.
  const allIds = [...new Set([...(staticData?.regions||[]).map(x=>x.id), ...(apiData?.regions||[]).map(x=>x.id)])];
  const merged = allIds.map(id => ({ ...(stcById[id] || {}), ...(apiById[id] || {}) }));
  const data = { regions: merged };
  const r = data.regions.find(x => x.id === id) || data.regions[0];
  // If the admin-saved version was missing landmarks, fall back to the static one.
  if ((!r.landmarks || !r.landmarks.length) && stcById[r.id]?.landmarks) {
    r.landmarks = stcById[r.id].landmarks;
  }
  document.title = (isAr?r.name_ar:r.name_en) + ' — Guideon';
  // Only set a background if a real image exists; otherwise keep the
  // branded gradient placeholder (admin can add a photo from the panel).
  const heroEl = document.getElementById('rHero');
  if (r.hero) {
    const probe = new Image();
    probe.onload = () => { heroEl.style.backgroundImage = `url('${r.hero}')`; };
    probe.src = r.hero;
    // Where the photo comes from someone else's publication, say so on the page.
    if (r.hero_credit) {
      const c = document.createElement('span');
      c.className = 'hero-credit';
      c.textContent = '📷 ' + r.hero_credit;
      heroEl.appendChild(c);
    }
  }
  document.getElementById('rName').textContent = isAr?r.name_ar:r.name_en;
  document.getElementById('rTag').textContent = isAr?r.tagline_ar:r.tagline_en;
  document.getElementById('rSites').textContent = `${r.sites} ${isAr?'موقع سياحي':'sites of interest'}`;
  document.getElementById('rTime').textContent = (isAr?'أفضل وقت: ':'Best time: ') + (isAr?r.best_time_ar:r.best_time_en);
  document.getElementById('rIntro').textContent = isAr?r.intro_ar:r.intro_en;
  document.getElementById('hAbout').textContent = isAr?`عن ${r.name_ar}`:`About ${r.name_en}`;
  document.getElementById('hHighlights').textContent = isAr?'أبرز المعالم':'Top Highlights';
  const hls = isAr?r.highlights_ar:r.highlights_en;
  document.getElementById('rHighlights').innerHTML = hls.map(h => `<div class="hl-card"><div class="dot"></div><span>${h}</span></div>`).join('');

  // Interactive landmarks map — appears only if the region has coordinates.
  if (Array.isArray(r.landmarks) && r.landmarks.length) {
    const section = document.getElementById('rMapSection');
    section.style.display = '';
    document.getElementById('hMap').textContent = isAr ? `📍 خريطة معالم ${r.name_ar}` : `📍 Landmarks of ${r.name_en}`;
    document.getElementById('rMapSub').textContent = isAr
      ? `${r.landmarks.length} معلماً سياحياً. انقر على أيّ علامة للتفاصيل.`
      : `${r.landmarks.length} landmarks. Click any marker for details.`;
    // gd-map.js is loaded with `defer`, so it may not be ready when this
    // inline script runs. Poll briefly (up to 5s) until it appears, then
    // render. This makes the map reliably show for every visitor.
    const tryDraw = (tries = 0) => {
      if (window.gdMap && typeof window.gdMap.landmarks === 'function') {
        window.gdMap.landmarks('rLandmarksMap', r.landmarks, { lang: isAr ? 'ar' : 'en' })
          .catch(e => console.warn('landmarks map', e));
      } else if (tries < 50) {
        setTimeout(() => tryDraw(tries + 1), 100);
      } else {
        document.getElementById('rLandmarksMap').innerHTML =
          '<div class="text-center text-muted py-4">Map could not load. Please refresh the page.</div>';
      }
    };
    tryDraw();

    // A photo card per landmark, under the map. Photos are free-licence files
    // from Wikimedia Commons, so each one credits its author — that is the
    // condition the licence places on commercial reuse. A landmark with no
    // photo keeps a typed gradient tile rather than being dropped.
    const TYPE_LABEL = {
      religious:{ar:'ديني',en:'Religious'}, culture:{ar:'ثقافي',en:'Culture'},
      fort:{ar:'قلعة',en:'Fort'},           museum:{ar:'متحف',en:'Museum'},
      nature:{ar:'طبيعة',en:'Nature'},      beach:{ar:'شاطئ',en:'Beach'},
      mountain:{ar:'جبل',en:'Mountain'},    desert:{ar:'صحراء',en:'Desert'},
      heritage:{ar:'تراث',en:'Heritage'},   city:{ar:'مدينة',en:'City'},
    };
    const TYPE_GLYPH = { religious:'🕌', culture:'🎭', fort:'🏰', museum:'🏛️', nature:'🌿',
      beach:'🏖️', mountain:'⛰️', desert:'🏜️', heritage:'🗿', city:'🏙️' };

    document.getElementById('rCardsSection').style.display = '';
    document.getElementById('hCards').textContent = isAr ? 'مواقع تستحق الزيارة' : 'Sites to visit';
    document.getElementById('rLandmarkCards').innerHTML = r.landmarks.map(l => {
      const name = gdEsc(isAr ? (l.name_ar || l.name_en) : (l.name_en || l.name_ar));
      const alt  = gdEsc(isAr ? (l.name_en || '') : (l.name_ar || ''));
      const kind = TYPE_LABEL[l.type] ? (isAr ? TYPE_LABEL[l.type].ar : TYPE_LABEL[l.type].en) : '';
      const glyph = TYPE_GLYPH[l.type] || '📍';
      const gmaps = `https://www.google.com/maps/search/?api=1&query=${l.lat},${l.lng}`;
      const shot = l.image
        ? `<img src="${gdSafeUrl(l.image)}" alt="${name}" loading="lazy" decoding="async"
                onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'glyph',textContent:'${glyph}'}))">`
        : `<span class="glyph">${glyph}</span>`;
      const credit = l.image && l.credit
        ? `<p class="credit">📷 <a href="${gdSafeUrl(l.photo_source || l.image)}" target="_blank" rel="noopener nofollow">${gdEsc(l.credit)}</a>${l.licence ? ' · ' + gdEsc(l.licence) : ''}</p>`
        : '';
      return `<article class="lm-card">
        <div class="shot">${shot}${kind ? `<span class="kind">${kind}</span>` : ''}</div>
        <div class="body">
          <h3>${name}</h3>
          ${alt ? `<p class="alt">${alt}</p>` : ''}
          ${credit}
          <a class="go" href="${gmaps}" target="_blank" rel="noopener">${isAr ? 'افتح في خرائط Google ↗' : 'Open in Google Maps ↗'}</a>
        </div>
      </article>`;
    }).join('');
  }
  document.getElementById('cTitle').textContent = isAr?`اعثر على مرشد محلّي معتمد في ${r.name_ar}`:`Find a verified local guide in ${r.name_en}`;
  document.getElementById('cSub').textContent = isAr?'احجز مرشداً مرخّصاً من الوزارة يعرف هذه المنطقة عن ظهر قلب.':'Book a Ministry-licensed expert who knows this region inside out.';
  const btn = document.getElementById('cBtn');
  // search.html + guideController filter by `governorate` (regions.json name_en
  // ARE governorate names); `region` was ignored → unfiltered results.
  btn.href = `/search.html?governorate=${encodeURIComponent(r.name_en)}`;
  btn.textContent = isAr?'ابحث عن مرشدين →':'Browse guides →';
})();
</script>
</body>
</html>
