<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Guideon — Launch Poster 1</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1080px; overflow:hidden; }
  body { font-family:'Segoe UI','Cairo','Tajawal',Tahoma,Arial,sans-serif; }

  .poster {
    width:1080px; height:1080px; position:relative;
    background:
      linear-gradient(135deg, rgba(15,28,62,.92) 0%, rgba(15,123,108,.88) 100%),
      url('https://upload.wikimedia.org/wikipedia/commons/thumb/d/d7/Sultan_Qaboos_Grand_Mosque_%281%29.jpg/1920px-Sultan_Qaboos_Grand_Mosque_%281%29.jpg');
    background-size: cover, cover;
    background-position: center, center 40%;
    color:#fff; overflow:hidden;
  }

  /* decorative shapes */
  .deco-1 { position:absolute; width:340px; height:340px; border-radius:50%; background:radial-gradient(circle, rgba(200,155,60,.35), transparent 70%); top:-100px; right:-100px; }
  .deco-2 { position:absolute; width:280px; height:280px; border-radius:50%; background:radial-gradient(circle, rgba(26,188,156,.35), transparent 70%); bottom:-80px; left:-80px; }
  .deco-grid { position:absolute; inset:0; background-image:
      linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size:60px 60px; }

  .frame { position:absolute; inset:36px; border:3px solid rgba(200,155,60,.5); border-radius:32px; pointer-events:none; }

  .logo-row { position:absolute; top:70px; right:70px; left:70px; display:flex; justify-content:space-between; align-items:center; z-index:2; }
  .logo-row img { height:78px; filter:drop-shadow(0 4px 12px rgba(0,0,0,.5)); }
  .ministry-badge { background:rgba(255,255,255,.95); color:#0f1c3e; padding:10px 18px; border-radius:14px; font-size:18px; font-weight:800; }
  .ministry-badge .star { color:#c89b3c; }

  .content { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:0 80px; text-align:center; z-index:2; }

  .ribbon { background:linear-gradient(135deg,#c89b3c,#e6b950); color:#000; font-weight:900; padding:14px 36px; border-radius:50px; font-size:22px; letter-spacing:1px; box-shadow:0 8px 24px rgba(200,155,60,.5); margin-bottom:34px; }

  h1 { font-size:96px; font-weight:900; line-height:1.05; margin-bottom:14px; letter-spacing:-2px; text-shadow:0 4px 24px rgba(0,0,0,.4); }
  h1 .accent { color:#c89b3c; }
  h2 { font-size:36px; font-weight:600; opacity:.95; margin-bottom:48px; max-width:780px; line-height:1.4; }

  .features { display:flex; gap:18px; margin-bottom:52px; flex-wrap:wrap; justify-content:center; }
  .chip { background:rgba(255,255,255,.18); backdrop-filter:blur(10px); padding:14px 26px; border-radius:50px; font-size:22px; font-weight:700; border:2px solid rgba(255,255,255,.25); }

  .cta-row { display:flex; align-items:center; gap:28px; }
  .cta-btn { background:#c89b3c; color:#000; font-weight:900; padding:24px 50px; border-radius:18px; font-size:34px; box-shadow:0 12px 30px rgba(200,155,60,.5); }
  .cta-arrow { font-size:48px; color:#c89b3c; }

  .footer-bar { position:absolute; bottom:60px; right:80px; display:flex; align-items:center; gap:16px; font-size:24px; font-weight:700; z-index:2; }
  .icon-circle { width:50px; height:50px; background:#c89b3c; color:#000; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:24px; }

  .qr-badge { position:absolute; bottom:50px; left:50px; background:#fff; padding:14px; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,.35); display:flex; align-items:center; gap:14px; z-index:3; border:3px solid #c89b3c; }
  .qr-badge img { width:130px; height:130px; display:block; }
  .qr-badge .qr-text { color:#0f1c3e; max-width:130px; }
  .qr-badge .qr-label { font-size:18px; font-weight:900; line-height:1.2; }
  .qr-badge .qr-en { font-size:13px; opacity:.7; margin-top:4px; font-weight:600; }
  .qr-badge .qr-url { font-size:14px; color:#0f7b6c; font-weight:800; margin-top:6px; direction:ltr; }
</style>
</head>
<body>
<div class="poster">
  <div class="deco-grid"></div>
  <div class="deco-1"></div>
  <div class="deco-2"></div>
  <div class="frame"></div>

  <div class="logo-row">
    <img src="/logo.png" alt="Guideon">
    <div class="ministry-badge"><span class="star">★</span> معتمد من الوزارة</div>
  </div>

  <div class="content">
    <div class="ribbon">🌿 الإطلاق الرسمي</div>
    <h1>اكتشف عُمان<br><span class="accent">مع خبير محلي</span></h1>
    <h2>أول منصة عُمانية تربطك بمرشدين سياحيين معتمدين من وزارة التراث والسياحة</h2>

    <div class="features">
      <div class="chip">✅ مرشدون موثّقون</div>
      <div class="chip">🌐 بالعربية والإنجليزية</div>
      <div class="chip">⭐ تقييمات حقيقية</div>
    </div>

    <div class="cta-row">
      <div class="cta-btn">احجز الآن</div>
      <div class="cta-arrow">◀</div>
      <div style="font-size:36px;font-weight:900">guideon.om</div>
    </div>
  </div>

  <div class="footer-bar">
    <div class="icon-circle">💬</div>
    <div dir="ltr">+968 9525 5450</div>
  </div>

  <div class="qr-badge">
    <img src="/marketing/qr-guideon.svg" alt="QR Code">
    <div class="qr-text">
      <div class="qr-label">امسح للزيارة</div>
      <div class="qr-en">SCAN TO VISIT</div>
      <div class="qr-url">guideon.om</div>
    </div>
  </div>
</div>
</body>
</html>
