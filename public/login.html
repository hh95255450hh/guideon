<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f7b6c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Guideon">
  <link rel="apple-touch-icon" href="/icon-192.png">
<title>Guideon — Sign In</title>
<link id="bs-ltr" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link id="bs-rtl" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" media="not all">
<link rel="stylesheet" href="/css/style.css?v=11">
</head>
<body class="auth-bg" style="min-height:100vh;display:flex;flex-direction:column">

<nav class="navbar navbar-dark">
  <div class="container d-flex justify-content-between align-items-center">
    <a class="navbar-brand" href="/"><img src="/logo.png" alt="Guideon" height="52"></a>
    <button class="btn btn-sm btn-outline-light lang-toggle" onclick="I18N.toggle()">🌐 عربي</button>
  </div>
</nav>

<div class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="auth-card p-4 p-md-5">
          <div class="text-center mb-4">
            <img src="/logo.png" alt="Guideon" style="height:88px;margin-bottom:8px">
            <h3 class="fw-800 mt-2" data-i18n="login_title">Welcome Back</h3>
            <p class="text-muted small" data-i18n="login_sub">Sign in to manage your bookings</p>
          </div>

          <div id="errMsg" class="alert alert-danger d-none small"></div>

          <form id="loginForm" onsubmit="doLogin(event)">
            <div class="mb-3">
              <label class="form-label fw-600 small" data-i18n="email_lbl">Email Address</label>
              <input type="email" class="form-control" id="email" data-i18n-ph="email_ph" placeholder="you@example.com" required>
            </div>
            <div class="mb-4">
              <label class="form-label fw-600 small" data-i18n="pass_lbl">Password</label>
              <input type="password" class="form-control" id="password" data-i18n-ph="pass_ph" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-teal btn w-100 py-2" id="submitBtn" data-i18n="login_btn">Sign In</button>
          </form>

          <hr class="my-4">
          <div class="mb-3">
            <p class="small text-muted fw-700 text-center mb-2" data-i18n="demo_accounts">Quick Login — Demo Accounts</p>
            <div class="d-flex flex-wrap gap-2 justify-content-center">
              <button class="btn btn-sm btn-outline-secondary" onclick="fill('tourist@example.com','Password123!')">👤 Tourist</button>
              <button class="btn btn-sm btn-outline-secondary" onclick="fill('mohammed@Guideon.om','Password123!')">🎒 Guide</button>
              <button class="btn btn-sm btn-outline-secondary" onclick="fill('admin@Guideon.om','Admin123!')">🛡️ Admin</button>
            </div>
          </div>

          <p class="text-center small text-muted mt-4">
            <span data-i18n="no_account">Don't have an account?</span>
            <a href="/register.html" class="fw-600" style="color:var(--teal)" data-i18n="signup_link">Sign Up</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/i18n.js?v=10"></script>
<script src="/js/chatbot.js?v=11"></script>
<script>
function fill(e, p) {
  document.getElementById('email').value = e;
  document.getElementById('password').value = p;
}

async function doLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const err = document.getElementById('errMsg');
  err.classList.add('d-none');
  btn.disabled = true;
  btn.textContent = I18N.t('login_loading');
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.message);
    const dashMap = { tourist: '/tourist-dashboard.html', guide: '/guide-dashboard.html', admin: '/admin.html' };
    window.location.href = dashMap[d.user.userType] || '/';
  } catch(ex) {
    err.textContent = ex.message; err.classList.remove('d-none');
  } finally {
    btn.disabled = false; btn.textContent = I18N.t('login_btn');
  }
}
</script>
<script src="/js/pwa.js?v=10"></script>
</body>
</html>
