<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f7b6c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Guideon">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="shortcut icon" href="/favicon.ico">
<title>Guideon — Sign In</title>
<!-- v2 -->
<link id="bs-ltr" rel="stylesheet" href="/css/bootstrap.min.css">
<link id="bs-rtl" rel="stylesheet" href="/css/bootstrap.rtl.min.css" media="not all">
<link rel="stylesheet" href="/css/style.css?v=28">
</head>
<body class="auth-bg" style="min-height:100vh;display:flex;flex-direction:column">

<nav class="navbar navbar-dark">
  <div class="container d-flex justify-content-between align-items-center">
    <a class="navbar-brand" href="/"><img src="/logo.png" alt="Guideon" height="52"></a>
    <button class="btn btn-sm btn-outline-light lang-toggle" onclick="I18N.toggle()">🌐 عربي</button>
  </div>
</nav>

<div class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="auth-card p-4 p-md-5">
          <div class="text-center mb-4">
            <img src="/logo.png" alt="Guideon" style="height:88px;margin-bottom:8px">
            <h3 class="fw-800 mt-2" data-i18n="login_title">Welcome Back</h3>
            <p class="text-muted small" data-i18n="login_sub">Sign in to manage your bookings</p>
          </div>

          <div id="errMsg" class="alert alert-danger d-none small"></div>

          <form id="loginForm" onsubmit="doLogin(event)">
            <div class="mb-3">
              <label class="form-label fw-600 small" data-i18n="email_lbl">Email Address</label>
              <input type="email" class="form-control" id="email" data-i18n-ph="email_ph" placeholder="you@example.com" required>
            </div>
            <div class="mb-2">
              <label class="form-label fw-600 small" data-i18n="pass_lbl">Password</label>
              <input type="password" class="form-control" id="password" data-i18n-ph="pass_ph" placeholder="••••••••" required>
            </div>
            <div class="text-end mb-3">
              <a href="/forgot-password.html" class="small fw-600 text-decoration-none" style="color:var(--teal)" data-i18n="forgot_pwd_link">Forgot password?</a>
            </div>
            <button type="submit" class="btn-teal btn w-100 py-2" id="submitBtn" data-i18n="login_btn">Sign In</button>
          </form>

          <p class="text-center small text-muted mt-4 mb-2">
            <span data-i18n="no_account">Don't have an account?</span>
            <a href="/register.html" class="fw-600" style="color:var(--teal)" data-i18n="signup_link">Sign Up</a>
          </p>
          <p class="text-center small text-muted mt-2">
            <a href="#" onclick="event.preventDefault();resendVerification();" class="text-decoration-none" data-i18n="resend_verify_link">Didn't get verification email? Resend</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="/js/bootstrap.bundle.min.js"></script>
<script src="/js/i18n.js?v=22"></script>
<script src="/js/chatbot.js?v=13"></script>
<script>
async function resendVerification() {
  const email = document.getElementById('email').value.trim();
  const err = document.getElementById('errMsg');
  if (!email) {
    err.textContent = 'Enter your email above first.';
    err.className = 'alert alert-warning small';
    err.classList.remove('d-none');
    return;
  }
  try {
    const r = await fetch('/api/auth/resend-verification', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    const d = await r.json();
    err.textContent = d.message;
    err.className = 'alert ' + (d.success ? 'alert-success' : 'alert-danger') + ' small';
    err.classList.remove('d-none');
  } catch {
    err.textContent = 'Network error.';
    err.className = 'alert alert-danger small';
    err.classList.remove('d-none');
  }
}

async function doLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const err = document.getElementById('errMsg');
  err.classList.add('d-none');
  btn.disabled = true;
  btn.textContent = I18N.t('login_loading');
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.message);
    const dashMap = { tourist: '/tourist-dashboard.html', guide: '/guide-dashboard.html', admin: '/admin.html', company: '/company-dashboard.html' };
    window.location.href = dashMap[d.user.userType] || '/';
  } catch(ex) {
    err.textContent = ex.message; err.classList.remove('d-none');
  } finally {
    btn.disabled = false; btn.textContent = I18N.t('login_btn');
  }
}
</script>
<script src="/js/pwa.js?v=12"></script>
<script>
window.addEventListener('load', () => {
  setTimeout(() => {
    const t = document.createElement('div');
    t.style.cssText = 'position:fixed;bottom:24px;right:24px;max-width:320px;background:#0f7b6c;color:#fff;border-radius:14px;padding:16px 20px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:9999;font-size:.9rem;animation:slideUp .4s ease';
    t.innerHTML = `
      <div style="font-size:1.3rem;margin-bottom:6px">🌍 مرحباً بك في Guideon</div>
      <div style="opacity:.92;line-height:1.5">اكتشف أفضل المرشدين السياحيين في عُمان.<br>سجّل حسابك مجاناً الآن!</div>
      <div style="margin-top:12px;display:flex;gap:8px">
        <a href="/register.html" style="background:#fff;color:#0f7b6c;padding:6px 16px;border-radius:8px;font-weight:700;text-decoration:none;font-size:.85rem">إنشاء حساب</a>
        <button onclick="this.closest('div[style]').remove()" style="background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:.85rem">لاحقاً</button>
      </div>`;
    document.body.appendChild(t);
    const s = document.createElement('style');
    s.textContent = '@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}';
    document.head.appendChild(s);
    setTimeout(() => t.remove(), 12000);
  }, 1500);
});
</script>
</body>
</html>
