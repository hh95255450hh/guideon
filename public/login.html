<head>

<title>Guideon — Sign In</title>
<!-- v2 -->
<script>
/* Bootstrap CSS picker — see i18n.js for the swap logic on lang change */
(function(){
  var s = localStorage.getItem('gd_lang');try{if(localStorage.getItem('gd_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}
  var nav = (navigator.language||'en').slice(0,2).toLowerCase();
  var lang = s || (['en','ar','zh','hi','es','fr','bn','pt','ru','ur'].indexOf(nav)>=0 ? nav : 'en');
  var rtl = lang === 'ar' || lang === 'ur';
  var l = document.createElement('link');
  l.id = rtl ? 'bs-rtl' : 'bs-ltr';
  l.rel = 'stylesheet';
  l.href = rtl ? '/css/bootstrap.rtl.min.css' : '/css/bootstrap.min.css';
  document.head.appendChild(l);
})();
</script>
<link rel="stylesheet" href="/css/style.css?v=40">
<script src="/js/image-compress.js?v=3"></script>
</head>
<body class="auth-bg" style="min-height:100vh;display:flex;flex-direction:column">

<nav class="navbar navbar-dark">
  <div class="container d-flex justify-content-between align-items-center">
    <a class="navbar-brand" href="/"><img src="/logo.png" alt="Guideon" height="52"></a>
    <button class="btn btn-sm btn-outline-light lang-toggle" onclick="I18N.toggle()">🌐 عربي</button>
  </div>
</nav>

<div class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="auth-card p-4 p-md-5">
          <div class="text-center mb-4">
            <img loading="lazy" decoding="async" src="/logo.png" alt="Guideon" style="height:88px;margin-bottom:8px">
            <h3 class="fw-800 mt-2" data-i18n="login_title">Welcome Back</h3>
            <p class="text-muted small" data-i18n="login_sub">Sign in to manage your bookings</p>
          </div>

          <div id="errMsg" class="alert alert-danger d-none small"></div>

          <form id="loginForm" onsubmit="doLogin(event)">
            <div class="mb-3">
              <label class="form-label fw-600 small" data-i18n="email_lbl">Email Address</label>
              <input type="email" class="form-control" id="email" data-i18n-ph="email_ph" placeholder="you@example.com" required>
            </div>
            <div class="mb-2">
              <label class="form-label fw-600 small" data-i18n="pass_lbl">Password</label>
              <input type="password" class="form-control" id="password" data-i18n-ph="pass_ph" placeholder="••••••••" required>
            </div>
            <div class="text-end mb-3">
              <a href="/forgot-password.html" class="small fw-600 text-decoration-none" style="color:var(--teal)" data-i18n="forgot_pwd_link">Forgot password?</a>
            </div>
            <button type="submit" class="btn-teal btn w-100 py-2" id="submitBtn" data-i18n="login_btn">Sign In</button>
          </form>

          <!-- Google Sign-In (shown only when configured) -->
          <div id="googleAuthWrap" class="d-none">
            <div class="d-flex align-items-center my-3">
              <hr class="flex-grow-1 m-0"><span class="px-2 small text-muted" data-i18n="or_lbl">or</span><hr class="flex-grow-1 m-0">
            </div>
            <div id="googleBtn" class="d-flex justify-content-center"></div>
          </div>

          <!-- 2FA step (hidden until needed) -->
          <form id="twoFaForm" class="d-none" onsubmit="doVerify2FA(event)">
            <div class="text-center mb-3">
              <div style="font-size:2.5rem">🔐</div>
              <h5 class="fw-800 mt-2" data-i18n="tfa_title">Two-Factor Authentication</h5>
              <p class="text-muted small mb-0" data-i18n="tfa_subtitle">Enter the 6-digit code from your authenticator app</p>
            </div>
            <div class="mb-3">
              <input type="text" class="form-control text-center" id="tfaCode" maxlength="20" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" required style="font-size:1.4rem;letter-spacing:.3rem;font-weight:700">
            </div>
            <button type="submit" class="btn-teal btn w-100 py-2" id="tfaSubmitBtn" data-i18n="tfa_verify_btn">Verify</button>
            <div class="text-center mt-3 small">
              <a href="#" onclick="event.preventDefault();cancel2FA();" class="text-muted text-decoration-none" data-i18n="tfa_use_backup">Lost your phone? Use a backup code instead</a>
            </div>
          </form>

          <p class="text-center small text-muted mt-4 mb-2">
            <span data-i18n="no_account">Don't have an account?</span>
            <a href="/register.html" class="fw-600" style="color:var(--teal)" data-i18n="signup_link">Sign Up</a>
          </p>
          <p class="text-center small text-muted mt-2">
            <a href="#" onclick="event.preventDefault();resendVerification();" class="text-decoration-none" data-i18n="resend_verify_link">Didn't get verification email? Resend</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script defer src="/js/bootstrap.bundle.min.js"></script>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
// ── Google Sign-In ──────────────────────────────────────────────
async function initGoogle() {
  try {
    const r = await fetch('/api/auth/google-config');
    const { clientId } = await r.json();
    if (!clientId) return;

    const start = () => {
      if (!window.google || !google.accounts) { setTimeout(start, 300); return; }

      google.accounts.id.initialize({
        client_id: clientId,
        callback: onGoogleCredential,
        auto_select: false,
        cancel_on_tap_outside: true,
        ux_mode: 'popup',
      });

      google.accounts.id.renderButton(
        document.getElementById('googleBtn'),
        { theme: 'outline', size: 'large', shape: 'pill', text: 'continue_with', width: 300 }
      );

      document.getElementById('googleAuthWrap').classList.remove('d-none');
    };
    start();
  } catch (_) {}
}
async function onGoogleCredential(resp) {
  const err = document.getElementById('errMsg');
  err.textContent = I18N.lang === 'ar' ? '⏳ جاري تسجيل الدخول...' : '⏳ Signing in...';
  err.className = 'alert alert-info small';
  err.classList.remove('d-none');
  try {
    const r = await fetch('/api/auth/google', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ credential: resp.credential }),
    });
    let d;
    try { d = await r.json(); } catch { throw new Error('Server error. Please try again.'); }
    if (!d.success) throw new Error(d.message);
    err.textContent = I18N.lang === 'ar' ? '✅ تم الدخول! جاري التحويل...' : '✅ Success! Redirecting...';
    err.className = 'alert alert-success small';
    setTimeout(() => { window.location.href = DASH_MAP[d.user.userType] || '/'; }, 800);
  } catch (e) {
    err.textContent = e.message || 'Google sign-in failed. Please try again.';
    err.className = 'alert alert-danger small';
    err.classList.remove('d-none');
  }
}
document.addEventListener('DOMContentLoaded', initGoogle);

async function resendVerification() {
  const email = document.getElementById('email').value.trim();
  const err = document.getElementById('errMsg');
  if (!email) {
    err.textContent = 'Enter your email above first.';
    err.className = 'alert alert-warning small';
    err.classList.remove('d-none');
    return;
  }
  try {
    const r = await fetch('/api/auth/resend-verification', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    const d = await r.json();
    err.textContent = d.message;
    err.className = 'alert ' + (d.success ? 'alert-success' : 'alert-danger') + ' small';
    err.classList.remove('d-none');
  } catch {
    err.textContent = 'Network error.';
    err.className = 'alert alert-danger small';
    err.classList.remove('d-none');
  }
}

const DASH_MAP = { tourist: '/tourist-dashboard.html', guide: '/guide-dashboard.html', admin: '/admin.html', staff: '/admin.html', company: '/company-dashboard.html', team: '/team-dashboard.html' };

async function doLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const err = document.getElementById('errMsg');
  err.classList.add('d-none');
  btn.disabled = true;
  btn.textContent = I18N.t('login_loading');
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.message);
    if (d.requires2FA) {
      // Switch to 2FA prompt
      document.getElementById('loginForm').classList.add('d-none');
      document.getElementById('twoFaForm').classList.remove('d-none');
      setTimeout(() => document.getElementById('tfaCode').focus(), 50);
      return;
    }
    window.location.href = DASH_MAP[d.user.userType] || '/';
  } catch(ex) {
    err.textContent = ex.message; err.classList.remove('d-none');
  } finally {
    btn.disabled = false; btn.textContent = I18N.t('login_btn');
  }
}

async function doVerify2FA(e) {
  e.preventDefault();
  const btn = document.getElementById('tfaSubmitBtn');
  const err = document.getElementById('errMsg');
  err.classList.add('d-none');
  btn.disabled = true;
  try {
    const r = await fetch('/api/2fa/verify', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: document.getElementById('tfaCode').value.trim() }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.message);
    window.location.href = DASH_MAP[d.user.userType] || '/';
  } catch(ex) {
    err.textContent = ex.message; err.classList.remove('d-none');
  } finally {
    btn.disabled = false;
  }
}

function cancel2FA() {
  // Just hint the user — backup codes go in the same field as TOTP codes
  document.getElementById('tfaCode').placeholder = 'XXXXX-XXXXX';
  document.getElementById('tfaCode').focus();
}
</script>

    t.innerHTML = `
      <div style="font-size:1.3rem;margin-bottom:6px">🌍 مرحباً بك في Guideon</div>
      <div style="opacity:.92;line-height:1.5">اكتشف أفضل المرشدين السياحيين في عُمان.<br>سجّل حسابك مجاناً الآن!</div>
      <div style="margin-top:12px;display:flex;gap:8px">

      </div>`;

    const s = document.createElement('style');
    s.textContent = '@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}';
    document.head.appendChild(s);
    setTimeout(() => t.remove(), 12000);
  }, 1500);
});
</script>
