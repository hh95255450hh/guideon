<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<title>تأكيد الدفع — Guideon</title>
<link rel="stylesheet" href="/css/bootstrap.min.css">
<link rel="stylesheet" href="/css/style.css?v=40">
<style>
  body{background:#eef2f7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:'Tajawal','Inter',sans-serif}
  .card-box{background:#fff;border-radius:20px;box-shadow:0 12px 48px rgba(15,28,62,.14);width:100%;max-width:460px;padding:44px 34px;text-align:center}
  .tick{width:88px;height:88px;border-radius:50%;background:#dcfce7;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:46px}
  .spin{width:54px;height:54px;border:5px solid #e5e7eb;border-top-color:#0f7b6c;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 18px}
  @keyframes spin{to{transform:rotate(360deg)}}
  h3{font-weight:800;color:#0f1c3e;margin-bottom:10px}
  p{color:#555;line-height:1.8}
</style>
</head>
<body>
<div class="card-box" id="box">
  <div class="spin"></div>
  <h3>جارٍ تأكيد الدفع…</h3>
  <p>لحظة من فضلك، نتحقّق من عملية الدفع مع Paymob.</p>
</div>

<script>
const qs = p => new URLSearchParams(location.search).get(p);
(async () => {
  const bookingId = qs('booking_id');
  const sessionId = qs('session_id');           // Thawani only
  const paymobOk  = qs('success');              // Paymob redirect flag ('true'/'false')
  const box = document.getElementById('box');

  function fail(msg) {
    box.innerHTML = `
      <div class="tick" style="background:#fee2e2">⚠️</div>
      <h3>لم يكتمل الدفع</h3>
      <p>${msg}</p>
      <a href="/tourist-dashboard.html#bookings" class="btn btn-teal w-100 mt-2" style="padding:13px">العودة إلى حجوزاتي</a>`;
  }
  function processing() {
    box.innerHTML = `
      <div class="tick" style="background:#fef9c3">⏳</div>
      <h3>تتمّ معالجة دفعتك…</h3>
      <p>قد يستغرق التأكيد لحظات. سنُحدّث حالة حجزك تلقائيّاً — لا حاجة لإعادة الدفع. يمكنك المتابعة من حجوزاتي.</p>
      <a href="/tourist-dashboard.html#bookings" class="btn btn-teal w-100 mt-2" style="padding:13px">العودة إلى حجوزاتي</a>`;
  }
  function done() {
    box.innerHTML = `
      <div class="tick">✅</div>
      <h3>تم الدفع بنجاح!</h3>
      <p>تم استلام دفعتك وأُرسل حجزك إلى مزوّد الخدمة لتأكيده. تابع التفاصيل من حجوزاتي. رحلة سعيدة! 🌿</p>
      <a href="/tourist-dashboard.html#bookings" class="btn btn-teal w-100 mt-2" style="padding:13px">العودة إلى حجوزاتي</a>`;
  }

  if (!bookingId) { fail('بيانات الدفع ناقصة.'); return; }
  if (paymobOk === 'false') { fail('تم إلغاء عملية الدفع أو لم تكتمل.'); return; }

  // ── Thawani: server-side verify with the session id ──
  if (sessionId) {
    try {
      const r = await fetch(`/api/payments/verify?session_id=${encodeURIComponent(sessionId)}&booking_id=${encodeURIComponent(bookingId)}`, { credentials:'include' });
      if (r.status === 401) { location.href = '/login.html'; return; }
      const d = await r.json();
      return (d.success && d.paid) ? done()
        : fail('لم نتمكّن من تأكيد الدفع. إن كنت قد دفعت، تواصل مع الدعم وسنؤكّده يدويّاً.');
    } catch (e) { return fail('تعذّر الاتصال بالخادم. حاول مرّة أخرى.'); }
  }

  // ── Paymob: settlement arrives via webhook — poll the booking status ──
  for (let i = 0; i < 8; i++) {
    try {
      const r = await fetch(`/api/payments/status/${encodeURIComponent(bookingId)}`, { credentials:'include' });
      if (r.status === 401) { location.href = '/login.html'; return; }
      const d = await r.json();
      const b = d.booking;
      if (b && (b.isPaid || b.depositPaidAt || (b.status && b.status !== 'awaiting_payment'))) return done();
    } catch (_) { /* retry */ }
    await new Promise(res => setTimeout(res, 2000));
  }
  // Webhook hasn't landed yet — reassure the user; it settles automatically.
  processing();
})();
</script>

<script src="/js/common-widgets.js?v=22"></script>
</body>
</html>
