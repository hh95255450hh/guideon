<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f7b6c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Guideon">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="shortcut icon" href="/favicon.ico">
  <title>Payment Confirmed – GUIDEON</title>
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f0;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      width: 100%; max-width: 420px;
      padding: 48px 36px;
      text-align: center;
    }
    .icon { font-size: 56px; margin-bottom: 20px; }
    h1 { font-size: 24px; color: #1a6b4a; margin-bottom: 10px; }
    p  { color: #555; font-size: 15px; line-height: 1.6; }
    .booking-id {
      margin-top: 20px;
      padding: 12px;
      background: #f5f5f0;
      border-radius: 8px;
      font-size: 13px;
      color: #333;
      word-break: break-all;
    }
    .status-badge {
      display: inline-block;
      margin-top: 16px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }
    .status-badge.paid       { background: #e8f5ee; color: #1a6b4a; }
    .status-badge.processing { background: #fff3e0; color: #e65100; }
    .status-badge.failed     { background: #fdf2f2; color: #c0392b; }
  </style>
</head>
<body>
<div class="card">
  <div class="icon" id="icon">⏳</div>
  <h1 id="title">Verifying payment…</h1>
  <p id="message">Please wait while we confirm your payment.</p>
  <div class="booking-id" id="booking-id" style="display:none"></div>
  <span class="status-badge" id="badge" style="display:none"></span>
</div>

<script>
  const qs = (p) => new URLSearchParams(window.location.search).get(p);
  const API_BASE    = window.location.origin;
  const STRIPE_KEY  = 'pk_test_REPLACE_WITH_YOUR_PUBLISHABLE_KEY'; // ← replace
  const stripe      = Stripe(STRIPE_KEY);

  const states = {
    succeeded: {
      icon: '✅', title: 'Payment Confirmed!',
      message: 'Your booking is confirmed. A confirmation email has been sent to you.',
      badge: 'Paid', badgeClass: 'paid',
    },
    processing: {
      icon: '⏳', title: 'Payment Processing',
      message: "Your payment is being processed. We'll email you once confirmed.",
      badge: 'Processing', badgeClass: 'processing',
    },
    failed: {
      icon: '❌', title: 'Payment Failed',
      message: 'Your payment could not be completed. Please try again.',
      badge: 'Failed', badgeClass: 'failed',
    },
  };

  (async () => {
    const clientSecret = qs('payment_intent_client_secret');
    const bookingId    = qs('booking_id');

    if (!clientSecret) {
      document.getElementById('icon').textContent    = '❌';
      document.getElementById('title').textContent   = 'Invalid Link';
      document.getElementById('message').textContent = 'No payment information found.';
      return;
    }

    const { paymentIntent } = await stripe.retrievePaymentIntent(clientSecret);
    const s = states[paymentIntent.status] || states.failed;

    document.getElementById('icon').textContent    = s.icon;
    document.getElementById('title').textContent   = s.title;
    document.getElementById('message').textContent = s.message;

    const badge = document.getElementById('badge');
    badge.textContent  = s.badge;
    badge.className    = `status-badge ${s.badgeClass}`;
    badge.style.display = 'inline-block';

    if (bookingId) {
      const el = document.getElementById('booking-id');
      el.innerHTML     = `Booking ID: <strong>${bookingId}</strong>`;
      el.style.display = 'block';
    }
  })();
</script>
<script src="/js/pwa.js?v=11"></script>
</body>
</html>
