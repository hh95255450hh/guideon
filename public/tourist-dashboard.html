<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<link rel="preload" as="script" href="/js/common-widgets.js?v=14">
<link rel="stylesheet" href="/css/gd-instant.css?v=1">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f7b6c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Guideon">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="shortcut icon" href="/favicon.ico">
<title>My Dashboard — Guideon</title>
<script>
/* Bootstrap CSS picker — see i18n.js for the swap logic on lang change */
(function(){
  var s = localStorage.getItem('gd_lang');
  var nav = (navigator.language||'en').slice(0,2).toLowerCase();
  var lang = s || (['en','ar','zh','hi','es','fr','bn','pt','ru','ur'].indexOf(nav)>=0 ? nav : 'en');
  var rtl = lang === 'ar' || lang === 'ur';
  var l = document.createElement('link');
  l.id = rtl ? 'bs-rtl' : 'bs-ltr';
  l.rel = 'stylesheet';
  l.href = rtl ? '/css/bootstrap.rtl.min.css' : '/css/bootstrap.min.css';
  document.head.appendChild(l);
})();
</script>
<link rel="stylesheet" href="/css/style.css?v=40">
<script src="/js/image-compress.js?v=3"></script>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" href="/"><img src="/logo.png" alt="Guideon" height="52"></a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <div class="navbar-controls ms-auto">
        <button class="btn btn-sm btn-outline-light lang-toggle" onclick="I18N.toggle()">🌐 عربي</button>
        <span class="text-white opacity-75 small" id="navName"></span>
        <a href="/guides/tourist-handbook-ar.pdf" target="_blank" class="btn btn-sm btn-outline-light" title="دليل الاستخدام">📖</a>
        <a href="/wishlist.html" class="btn btn-sm btn-outline-light" title="Wishlist">❤️</a>
        <a href="/profile.html" class="btn btn-sm btn-outline-light" title="My Profile">👤</a>
        <a href="/search.html" class="btn btn-outline-light btn-sm" data-i18n="nav_find">Find a Guide</a>
        <button class="btn btn-sm btn-danger" onclick="doLogout()" data-i18n="nav_signout">Sign Out</button>
      </div>
    </div>
  </div>
</nav>

<div class="dash-header">
  <div class="container">
    <h2 class="mb-3" data-i18n="tourist_dash">My Dashboard 📋</h2>
    <div class="row g-3">
      <div class="col-6 col-md-3"><div class="dash-stat"><div class="num" id="statTotal">—</div><div class="lbl" data-i18n="total_bk">Total Bookings</div></div></div>
      <div class="col-6 col-md-3"><div class="dash-stat"><div class="num" id="statConfirmed">—</div><div class="lbl" data-i18n="confirmed_bk">Confirmed</div></div></div>
      <div class="col-6 col-md-3"><div class="dash-stat"><div class="num" id="statPending">—</div><div class="lbl" data-i18n="pending_bk">Pending</div></div></div>
      <div class="col-6 col-md-3"><div class="dash-stat"><div class="num" id="statCompleted">—</div><div class="lbl" data-i18n="completed_bk">Completed</div></div></div>
    </div>
  </div>
</div>

<div class="container py-4">
  <div class="d-flex gap-2 mb-4 flex-wrap" id="filterTabs">
    <button class="btn btn-sm btn-teal active tab-btn" onclick="filterBookings('all',this)" data-i18n="tab_all">All</button>
    <button class="btn btn-sm btn-outline-secondary tab-btn" onclick="filterBookings('pending',this)" data-i18n="tab_pending">Pending</button>
    <button class="btn btn-sm btn-outline-secondary tab-btn" onclick="filterBookings('confirmed',this)" data-i18n="tab_confirmed">Confirmed</button>
    <button class="btn btn-sm btn-outline-secondary tab-btn" onclick="filterBookings('completed',this)" data-i18n="tab_completed">Completed</button>
    <button class="btn btn-sm btn-outline-secondary tab-btn" onclick="filterBookings('cancelled',this)" data-i18n="tab_cancelled">Cancelled</button>
  </div>

  <div id="bookingList">
    <div class="text-center py-5 text-muted" data-i18n="loading_guides">Loading bookings...</div>
  </div>

  <div class="mt-4 text-center">
    <a href="/search.html" class="btn-teal btn" data-i18n="find_guides">🔍 Find More Guides</a>
  </div>

  <!-- ── MESSAGES SECTION ── -->
  <div class="card shadow-sm mt-5" id="msgSection">
    <div class="card-header d-flex justify-content-between align-items-center" style="background:var(--teal);color:#fff">
      <h6 class="mb-0 fw-700" data-i18n="msg_section">💬 Messages</h6>
      <span class="badge bg-danger" id="msgUnreadBadge" style="display:none"></span>
    </div>
    <!-- Conversation list -->
    <div id="msgConvoView">
      <div class="p-2 border-bottom">
        <button class="btn btn-sm btn-teal w-100" onclick="contactSupport()" data-i18n="contact_support">🛟 Contact Guideon Support</button>
      </div>
      <div id="msgConvoList" class="list-group list-group-flush">
        <div class="text-center py-4 text-muted small" data-i18n="msg_loading">Loading messages...</div>
      </div>
    </div>
    <!-- Thread view (hidden until conversation opened) -->
    <div id="msgThreadView" style="display:none">
      <div class="p-2 border-bottom d-flex align-items-center gap-2">
        <button class="btn btn-sm btn-outline-secondary" onclick="showConvoList()" data-i18n="msg_back">← Back</button>
        <strong id="msgThreadName" class="ms-1"></strong>
        <span id="msgOnline" class="rounded-circle" style="display:none;width:9px;height:9px;background:#22c55e" title="Online"></span>
      </div>
      <div id="msgThreadMessages" style="height:320px;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#f8f9fa"></div>
      <div id="msgTyping" class="px-3 pb-1 text-muted small" style="display:none;font-style:italic">…</div>
      <div class="p-2 border-top d-flex gap-2 align-items-center">
        <input type="file" id="msgFile" accept="image/*" style="display:none" onchange="attachMsg(this)">
        <button class="btn btn-sm btn-outline-secondary" onclick="document.getElementById('msgFile').click()" title="Attach image" style="flex-shrink:0">📎</button>
        <input class="form-control form-control-sm" id="msgInput" data-i18n-ph="msg_type_ph" placeholder="Type a message..." oninput="typingMsg()">
        <button class="btn btn-sm btn-teal" onclick="sendMsg()" data-i18n="msg_send" style="flex-shrink:0">Send</button>
      </div>
    </div>
  </div>
</div>

<!-- Review Modal -->
<div class="modal fade" id="reviewModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header" style="background:var(--teal);color:#fff">
        <h5 class="modal-title" data-i18n="review_title">Write a Review</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="rvBookingId">
        <div class="mb-3">
          <label class="form-label fw-600" data-i18n="rating_req">Rating</label>
          <div class="d-flex gap-2 fs-2" id="starPicker">
            <span class="star-picker" onclick="setRating(1)">★</span>
            <span class="star-picker" onclick="setRating(2)">★</span>
            <span class="star-picker" onclick="setRating(3)">★</span>
            <span class="star-picker" onclick="setRating(4)">★</span>
            <span class="star-picker" onclick="setRating(5)">★</span>
          </div>
          <input type="hidden" id="rvRating" value="0">
        </div>
        <div class="mb-3">
          <label class="form-label fw-600" data-i18n="review_lbl">Your Review</label>
          <textarea class="form-control" id="rvComment" rows="4" data-i18n-ph="review_ph" placeholder="Share your experience with this guide..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="cancel_btn">Cancel</button>
        <button class="btn-teal btn" onclick="submitReview()" data-i18n="submit_review">Submit Review</button>
      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script defer src="/js/bootstrap.bundle.min.js"></script>
<script src="/js/i18n.js?v=50"></script>
<script src="/js/chatbot.js?v=13" defer></script>
<script>
let ALL_BOOKINGS = [];
let CURRENT_FILTER = 'all';
let MY_ID = null;
window.PAYMENTS_ENABLED = false;
fetch('/api/payments/feature-status', { credentials: 'include' })
  .then(r => r.json())
  .then(d => { window.PAYMENTS_ENABLED = !!d.enabled; })
  .catch(() => {});

function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = 'toast-msg' + (type ? ' ' + type : '');
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

async function doLogout() {
  try { await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' }); } catch {}
  window.location.href = '/';
}

function formatDate(d) {
  const locale = I18N.lang === 'ar' ? 'ar-OM' : 'en-GB';
  return new Date(d + 'T00:00:00').toLocaleDateString(locale, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

async function checkAuth() {
  try {
    const r = await fetch('/api/auth/me', { credentials: 'include' });
    const d = await r.json();
    if (!d.success || d.user.userType !== 'tourist') {
      window.location.href = '/login.html'; return;
    }
    MY_ID = d.user.id;
    document.getElementById('navName').textContent = d.user.fullName.split(' ')[0];
    loadBookings();
    initMessages();        // build the GDMessages instance now that MY_ID is known
    loadConvos();          // delegates to MSG.loadConvos()
    connectMsgSSE();       // delegates to MSG.connectSSE()
  } catch { window.location.href = '/login.html'; }
}

async function loadBookings() {
  try {
    const r = await fetch('/api/bookings/mine', { credentials: 'include' });
    const d = await r.json();
    ALL_BOOKINGS = d.bookings || [];

    const stats = ALL_BOOKINGS.reduce((acc, b) => {
      acc.total++; acc[b.status] = (acc[b.status] || 0) + 1; return acc;
    }, { total: 0 });

    document.getElementById('statTotal').textContent = stats.total;
    document.getElementById('statConfirmed').textContent = stats.confirmed || 0;
    document.getElementById('statPending').textContent = stats.pending || 0;
    document.getElementById('statCompleted').textContent = stats.completed || 0;

    renderBookings();
  } catch {
    document.getElementById('bookingList').innerHTML = '<div class="text-center text-danger py-4">Error loading bookings.</div>';
  }
}

function filterBookings(status, btn) {
  CURRENT_FILTER = status;
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.className = b.className.replace('btn-teal', 'btn-outline-secondary');
    b.classList.remove('active');
  });
  btn.className = btn.className.replace('btn-outline-secondary', 'btn-teal');
  btn.classList.add('active');
  renderBookings();
}

function renderBookings() {
  const list = CURRENT_FILTER === 'all' ? ALL_BOOKINGS : ALL_BOOKINGS.filter(b => b.status === CURRENT_FILTER);
  const container = document.getElementById('bookingList');

  if (!list.length) {
    const emptyLabel = CURRENT_FILTER === 'all' ? '' : I18N.t('tab_' + CURRENT_FILTER);
    container.innerHTML = `<div class="empty-state"><div class="icon">📋</div><h5>${I18N.t('no_bookings')}${emptyLabel ? ' — ' + emptyLabel : ''}</h5><p class="text-muted">${CURRENT_FILTER === 'all' ? I18N.t('no_bookings_sub') : ''}</p></div>`;
    return;
  }

  container.innerHTML = list.map(b => {
    const canCancel = ['pending', 'quoted', 'confirmed'].includes(b.status);
    // Status 'completed' is set by the guide only after the trip actually
    // ended — no need to also wait for the calendar to pass tourDate. The old
    // tourDatePast gate hid the review button on the same day the trip ended.
    const canReview = b.status === 'completed' && !b.reviewed;
    const statusIcon = { pending: '⏳', quoted: '💬', confirmed: '✅', completed: '🎉', cancelled: '❌' }[b.status] || '';
    const durationLabel = b.duration === 'half' ? I18N.t('half_day_lbl') : I18N.t('full_day_lbl');
    const pLabel = b.participants > 1 ? I18N.t('persons_lbl') : I18N.t('person_lbl');
    const statusLabel = I18N.t('status_' + b.status) || b.status;
    const isQuoted = b.status === 'quoted';
    const amount = isQuoted ? b.quotedAmount : b.totalAmount;

    return `
    <div class="booking-card ${b.status}">
      <div class="d-flex justify-content-between align-items-start mb-2">
        <div>
          <h6 class="fw-700 mb-1">📍 ${b.destination} — ${b.guideName}</h6>
          <div class="small text-muted">📅 ${formatDate(b.tourDate)} &nbsp;·&nbsp; ${durationLabel} &nbsp;·&nbsp; ${b.participants} ${pLabel}</div>
        </div>
        <span class="status-badge status-${b.status}">${statusIcon} ${statusLabel}</span>
      </div>
      ${b.specialRequests ? `<div class="small text-muted mb-2">💬 "${b.specialRequests}"</div>` : ''}
      ${isQuoted ? `<div class="alert alert-warning small mb-2 py-2">${I18N.t('quote_received') || 'عرض سعر من المرشد — اقبل لتأكيد الحجز'}</div>` : ''}
      ${b.status === 'pending' ? `<div class="small text-muted mb-2">${I18N.t('awaiting_quote') || '⏳ بانتظار رد المرشد بتحديد السعر'}</div>` : ''}
      <div class="d-flex justify-content-between align-items-center border-top pt-2 mt-2">
        <div class="fw-700 fs-5" style="color:var(--teal)">${amount ? 'OMR ' + amount : ''}</div>
        <div class="d-flex gap-2 flex-wrap">
          <a href="/guide-profile.html?id=${b.guideId}" class="btn btn-sm btn-outline-secondary">${I18N.t('view_guide')}</a>
          ${isQuoted ? `<button class="btn btn-sm btn-teal" onclick="acceptOffer('${b.id}')">${I18N.t('accept_offer') || '✅ قبول العرض'}</button>` : ''}
          ${(b.status === 'confirmed' && !b.isPaid && window.PAYMENTS_ENABLED) ? `<a href="/checkout.html?booking_id=${b.id}" class="btn btn-sm btn-gold">💳 ${I18N.t('pay_now') || 'ادفع الآن'}</a>` : ''}
          ${b.isPaid ? `<span class="badge bg-success-subtle text-success align-self-center">✓ ${I18N.t('paid_label') || 'مدفوع'}</span>` : ''}
          ${canReview ? `<button class="btn btn-sm btn-teal" onclick="openReview('${b.id}')">${I18N.t('write_review')}</button>` : ''}
          ${(b.status === 'completed' && b.reviewed) ? `<span class="badge bg-success-subtle text-success align-self-center">${I18N.t('reviewed_done') || '✓ Reviewed'}</span>` : ''}
          ${canCancel ? `<button class="btn btn-sm btn-outline-danger" onclick="cancelBooking('${b.id}')">${isQuoted ? (I18N.t('decline_offer') || 'رفض') : I18N.t('cancel_bk')}</button>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

async function cancelBooking(id) {
  if (!confirm(I18N.t('cancel_confirm'))) return;
  try {
    const r = await fetch(`/api/bookings/${id}/status`, {
      method: 'PATCH', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: 'cancelled' }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.message);
    toast(I18N.t('status_cancelled') + '.', 'success');
    loadBookings();
  } catch (e) { toast(e.message, 'error'); }
}

// Tourist accepts the guide's price offer → booking becomes confirmed.
async function acceptOffer(id) {
  try {
    const r = await fetch(`/api/bookings/${id}/status`, {
      method: 'PATCH', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: 'confirmed' }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.message);
    toast(I18N.t('offer_accepted') || '✅ تم قبول العرض وتأكيد الحجز', 'success');
    loadBookings();
  } catch (e) { toast(e.message, 'error'); }
}

let CURRENT_REVIEW_BOOKING = null;
function openReview(bookingId) {
  CURRENT_REVIEW_BOOKING = bookingId;
  document.getElementById('rvBookingId').value = bookingId;
  document.getElementById('rvComment').value = '';
  setRating(0);
  new bootstrap.Modal(document.getElementById('reviewModal')).show();
}

function setRating(val) {
  document.getElementById('rvRating').value = val;
  document.querySelectorAll('.star-picker').forEach((s, i) => {
    s.style.color = i < val ? '#f59e0b' : '#d1d5db';
  });
}

async function submitReview() {
  const rating = parseInt(document.getElementById('rvRating').value);
  const comment = document.getElementById('rvComment').value;
  if (!rating) { toast(I18N.t('rating_required'), 'error'); return; }
  try {
    const r = await fetch('/api/reviews', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bookingId: CURRENT_REVIEW_BOOKING, rating, comment }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.message);
    bootstrap.Modal.getInstance(document.getElementById('reviewModal')).hide();
    toast(I18N.t('submit_review') + ' ✓', 'success');
    loadBookings();
  } catch (e) { toast(e.message, 'error'); }
}

window.onLangChange = () => { renderBookings(); renderConvos(); };

checkAuth();

/* ── MESSAGES (real-time) ──
   All the real logic now lives in /js/gd-messages.js (shared with
   guide-dashboard and company-dashboard). This block only wires
   the tourist-specific config and exposes the original global
   function names so the HTML onclick handlers keep working. */
let MSG = null;
function initMessages() {
  MSG = window.GDMessages({
    prefix:      'msg',
    myId:        MY_ID,
    tickClass:   't-tick',
    badgeId:     'msgUnreadBadge',
    bubbleMaxPx: 200,
    toast:       (m, l) => toast(m, l),
  });
}
// Thin globals — keep the original symbol names so existing HTML
// onclick="..." handlers and other callers stay unchanged.
function loadConvos()     { return MSG && MSG.loadConvos(); }
function renderConvos()   { return MSG && MSG.renderConvos(); }
function openThread(i, n) { return MSG && MSG.openThread(i, n); }
function showConvoList()  { return MSG && MSG.showConvoList(); }
function sendMsg(extra)   { return MSG && MSG.sendMsg(extra); }
function attachMsg(inp)   { return MSG && MSG.attach(inp); }
function typingMsg()      { return MSG && MSG.typing(); }
function contactSupport() { return MSG && MSG.contactSupport(); }
function connectMsgSSE()  { return MSG && MSG.connectSSE(); }


</script>
<style>
.btn-teal { background: var(--teal) !important; color: #fff !important; border-color: var(--teal) !important; }
.star-picker { cursor: pointer; color: #d1d5db; transition: color .1s; }
.star-picker:hover { color: #f59e0b; }
</style>
<script src="/js/gd-messages.js?v=2"></script>
<script src="/js/pwa.js?v=14" defer></script>
<script src="/js/common-widgets.js?v=14"></script>
</body>
</html>
