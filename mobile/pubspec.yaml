name: guideon
description: Guideon — Oman's tour-guide marketplace. Official mobile app.
publish_to: 'none'
version: 1.0.0+16

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Networking + cookie-session auth (matches the web backend's express-session)
  dio: ^5.4.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  path_provider: ^2.1.2
  # State + storage
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  # UI
  cached_network_image: ^3.3.1
  intl: ^0.20.2
  url_launcher: ^6.2.4
  # Full-platform shell — load guideon.om inside the app (all features)
  webview_flutter: ^4.14.0
  webview_flutter_android: ^4.3.0
  # App version (force-update gate) + crash reporting context
  package_info_plus: ^8.0.2
  # Push notifications (backend already exposes /auth/fcm-token).
  # Gen-3 suite: gen-2 (core 2.x / messaging 14.x) can't satisfy the newer
  # firebase_*_web packages on pub (they need firebase_core_platform_interface
  # ^6, which core 2.x caps at ^5) — that mismatch broke `pub get`. The APIs
  # this app uses (initializeApp, FirebaseMessaging.instance, onBackgroundMessage,
  # getToken, requestPermission, onTokenRefresh) are unchanged across the major.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6
  # Native map (replaces WebView-based explore.html — more reliable on all devices)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # Device geolocation — "my location" on the map + nearest-guides sorting.
  geolocator: ^13.0.2
  # File selection for the WebView's <input type=file> (photo uploads). Uses the
  # system picker (Storage Access Framework) — needs no media permission.
  file_picker: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  # Generate store-grade launcher icons + native splash screens
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# ── App launcher icon (Android adaptive + iOS) ──────────────────────────────
flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"
  android: "ic_launcher"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  ios: true
  remove_alpha_ios: true

# ── Native splash screen ────────────────────────────────────────────────────
flutter_native_splash:
  color: "#0f1c3e"
  image: "assets/images/splash_logo.png"
  android_12:
    color: "#0f1c3e"
    image: "assets/images/splash_logo.png"
  ios: true
